<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover → we can read safe-area insets on notched phones.
     user-scalable=no + touch-action:none kills double-tap zoom & 300ms delay. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f6bff">
<title>Orbit Rush</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   ORBIT RUSH — styles. Dark, high-contrast, thumb-sized touch targets.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Safe-area insets (0 on non-notched devices / desktop browsers). */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  /* Height reserved for the AdMob banner; set from JS when a banner shows
     so no UI or gameplay-critical info ever sits behind the ad. */
  --banner-h: 0px;
  --ink:#ffffff; --dim:#e4e8ffd9; --accent:#ffd23f; --accent2:#ff3ea5;
  --panel:#3a1f9ef0; --btn:#ffffff2e; --deep:#24107a;   /* deep = outlines/shadows */
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  position:fixed; inset:0; overflow:hidden;
  background:#2f6bff; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;                 /* no browser gestures, no tap delay */
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block}

/* Invisible probes: their computed height gives us the safe-area inset in px
   so the canvas renderer (which can't read env()) can offset the HUD. */
#probe-top{position:absolute;top:0;height:var(--sat);width:1px;visibility:hidden}
#probe-bottom{position:absolute;bottom:0;height:calc(var(--sab) + var(--banner-h));width:1px;visibility:hidden}

/* ── Overlay screens ────────────────────────────────────────────────── */
.screen{
  position:absolute; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:calc(var(--sat) + 16px) 22px calc(var(--sab) + var(--banner-h) + 16px);
  background:linear-gradient(165deg,#3d74ffeb 0%,#7b3cffeb 55%,#ff4fa0eb 100%);
  backdrop-filter:blur(2px);
  text-align:center;
}
.screen.hidden{display:none}
h1.logo{
  font-size:clamp(38px,11vw,64px); font-weight:900; letter-spacing:.04em;
  color:#fff;                         /* chunky candy title: white + deep drop */
  text-shadow:0 5px 0 var(--deep),0 0 28px #ffffff99;
  animation:logoFloat 3.2s ease-in-out infinite;   /* subtle live menu motion */
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.tag{color:var(--dim);font-size:15px;margin-top:-8px}

button{
  font:inherit; color:var(--ink); border:0; cursor:pointer;
  background:var(--btn); border-radius:14px;
  padding:14px 22px; min-height:52px; min-width:64px;  /* thumb-sized */
  font-size:17px; font-weight:700;
  transition:transform .08s;
}
button:active{transform:scale(.95)}
button.primary{
  background:linear-gradient(180deg,#ffe86b,#ffb01f); color:#5a2a00;
  font-size:22px; padding:18px 54px; border-radius:18px;
  box-shadow:0 6px 0 #c96a00,0 10px 28px #00000040;   /* chunky 3D press */
  animation:pulseBtn 1.6s ease-in-out infinite;
}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
button.ad{background:linear-gradient(180deg,#ff7ac0,#ff3ea5);color:#fff;box-shadow:0 5px 0 #b3166d}
button.ghostbtn{background:#ffffff2e;box-shadow:0 4px 0 #00000026}
button:disabled{opacity:.35; animation:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.statline{color:var(--dim);font-size:14px;font-weight:600}
.statline b{color:var(--ink)}
.bigscore{font-size:clamp(52px,18vw,96px);font-weight:900;line-height:1;text-shadow:0 5px 0 var(--deep)}
.newbest{color:#ffe86b;text-shadow:0 3px 0 var(--deep);font-weight:900;letter-spacing:.12em;animation:pulseBtn 1s infinite}

/* game-over: headline + carried-over progress card */
.headline{font-size:clamp(22px,7vw,30px);font-weight:900;color:#ffe86b;text-shadow:0 3px 0 var(--deep);
  animation:pulseBtn 1.2s ease-in-out infinite;max-width:92vw}
.headline.calm{color:#fff;animation:none}
#over{gap:11px}
.carry{width:min(340px,88vw);background:#00000024;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.carryrow{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
.mission .up{color:#3dffb4;font-weight:900;margin-left:4px}

/* XP bar (start + game-over screens) */
.xpwrap{width:min(320px,80vw)}
.xpbar{height:10px;background:#00000030;border-radius:6px;overflow:hidden}
.xpbar>i{display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,#ffe86b,#ff9f1c);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xplabel{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}

/* Ghost bar: last run vs best */
.ghost{position:relative;width:min(320px,80vw);height:14px;background:#00000030;border-radius:7px}
.ghost>i.you{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#ffd23f}
.ghost>i.mark{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.ghost>span{position:absolute;right:6px;top:-18px;font-size:11px;color:var(--dim)}

/* Missions */
.missions{display:flex;flex-direction:column;gap:6px;width:min(340px,86vw)}
.mission{display:flex;align-items:center;gap:10px;background:#ffffff26;border-radius:12px;
  padding:9px 12px;font-size:13px;text-align:left}
.mission .mprog{margin-left:auto;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.mission.done{background:#ffd23f55}
.mission.done .mprog{color:var(--accent)}

/* Unlocks browser */
#unlocks .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94vw}
#unlocks .tabs button{padding:10px 14px;min-height:44px;min-width:0;font-size:14px}
#unlocks .tabs button.on{background:#ffd23f;color:#5a2a00}
.grid{display:grid;grid-template-columns:repeat(4,64px);gap:10px;max-height:44vh;
  overflow-y:auto;padding:6px;touch-action:pan-y}
.cell{width:64px;height:64px;border-radius:14px;border:2px solid #ffffff55;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.cell.eq{border-color:#fff;box-shadow:0 0 0 3px #ffd23f,0 0 16px #ffd23faa}
.cell.lock{opacity:.42}
.cell .cost{position:absolute;bottom:3px;left:0;right:0;font-size:9px;color:#fff;text-shadow:0 1px 2px #000}
.cell .badge{position:absolute;top:-6px;right:-6px;background:var(--accent2);color:#fff;
  font-size:8px;font-weight:900;padding:2px 5px;border-radius:8px;letter-spacing:.05em;
  animation:pulseBtn 1.2s infinite}
.cell.arm{border-color:#ffc94d;box-shadow:0 0 14px #ffc94daa;animation:pulseBtn .7s infinite}
.packrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:54px;padding:10px 16px;font-size:14px;text-align:left;
  background:#ffffff26;border-radius:12px}
.packrow b{text-align:right;color:#ffe86b;font-size:13px;line-height:1.25}
.packrow small{color:var(--dim);font-weight:400}
#shop-dot{color:var(--accent2);font-size:22px;line-height:0;vertical-align:middle;margin-left:4px}

/* Toast banners (level-up, unlock, streak, milestone) */
#toasts{position:absolute;top:calc(var(--sat) + 112px);   /* below the in-game score + combo */
  left:0;right:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--panel);border:1px solid #ffffff2a;border-radius:14px;
  padding:10px 20px;font-weight:800;font-size:16px;
  animation:toastIn .35s cubic-bezier(.2,1.4,.4,1), toastOut .4s ease-in 2.6s forwards;
  box-shadow:0 8px 30px #00000088;
}
.toast.big{font-size:20px;padding:14px 26px}
@keyframes toastIn{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}

/* Level-up full-screen flash + rising number */
#lvlfx{position:absolute;inset:0;z-index:25;pointer-events:none;display:none;
  align-items:center;justify-content:center}
#lvlfx.on{display:flex;animation:lvlFlash .9s ease-out}
#lvlfx .num{font-size:clamp(70px,26vw,150px);font-weight:900;color:#fff;
  text-shadow:0 6px 0 var(--deep),0 0 40px #ffd23f;
  animation:lvlRise 1.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes lvlFlash{0%{background:#ffd23f66}100%{background:transparent}}
@keyframes lvlRise{0%{transform:translateY(50px) scale(.5);opacity:0}
  30%{opacity:1}100%{transform:translateY(-40px) scale(1.15);opacity:0}}

/* In-game pause button */
#btn-pause{position:absolute;top:calc(var(--sat) + 10px);right:12px;z-index:5;
  width:46px;height:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;
  background:#ffffff33;font-size:18px;display:none;box-shadow:0 4px 0 #00000026}

/* Optional email invite (web build only). A small sheet over the bottom of
   the game-over screen, shown after a new best or a LEGENDARY run. It never
   blocks the retry button and closes by itself when a new run starts. */
#crew{position:absolute;left:50%;bottom:calc(var(--sab) + var(--banner-h) + 12px);z-index:12;
  width:min(380px,calc(100vw - 24px));transform:translateX(-50%);
  background:#1d0f5e;border:1px solid #ffffff33;border-radius:18px;padding:14px 14px 12px;
  box-shadow:0 14px 40px #00000080;text-align:left;
  touch-action:manipulation;user-select:text;-webkit-user-select:text;
  animation:crewIn .38s cubic-bezier(.2,1.2,.4,1)}
@keyframes crewIn{from{transform:translate(-50%,40px);opacity:0}}
#crew h3{font-size:16px;font-weight:900;line-height:1.25;color:#ffe86b;padding-right:30px}
#crew p{font-size:13px;color:var(--dim);margin:4px 0 10px;line-height:1.35}
#crew form{display:flex;gap:8px}
#crew input[type=email]{flex:1;min-width:0;height:46px;border-radius:12px;border:2px solid #ffffff40;
  background:#ffffff1a;color:#fff;font:inherit;font-size:16px;padding:0 12px;outline:none}
#crew input[type=email]:focus{border-color:#ffe86b}
#crew input::placeholder{color:#ffffff80}
#crew button.go{min-height:46px;padding:0 16px;font-size:15px;border-radius:12px;
  background:linear-gradient(180deg,#ffe86b,#ffb01f);color:#5a2a00;box-shadow:0 4px 0 #c96a00;white-space:nowrap}
#crew .x{position:absolute;top:6px;right:6px;width:40px;height:40px;min-width:40px;min-height:40px;padding:0;
  background:transparent;font-size:20px;color:#ffffffb0;border-radius:50%}
#crew .fine{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:#ffffffa0}
#crew .fine a{color:#ffffffc0}
#crew .skip{min-height:34px;min-width:0;white-space:nowrap;flex:0 0 auto;padding:4px 10px;font-size:13px;font-weight:700;background:#ffffff1f}
#crew .msg{font-size:12px;color:#ffb3d9;margin-top:6px;min-height:0}
#crew .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#crew.done h3{padding-right:0}

/* small util */
.hidden{display:none !important}
.dimtxt{color:var(--dim);font-size:12px;max-width:300px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="probe-top"></div><div id="probe-bottom"></div>
<button id="btn-pause" aria-label="Pause">II</button>
<div id="toasts"></div>
<div id="lvlfx"><div class="num" id="lvlfx-num">2</div></div>

<!-- ── START SCREEN ─────────────────────────────────────────────────── -->
<div class="screen" id="start">
  <h1 class="logo">ORBIT RUSH</h1>
  <div class="tag" data-i18n="tagline">tap to release · land in the next ring</div>
  <div class="statline"><span data-i18n="best">BEST</span> <b id="s-best">0</b> · <span data-i18n="streak">STREAK</span> <b id="s-streak">0</b>🔥 · <b id="s-rebirth"></b></div>
  <div class="statline">🪙 <b id="s-coins">0</b> <span data-i18n="coins">coins</span></div>
  <div class="xpwrap">
    <div class="xplabel"><span><span data-i18n="lvl">LVL</span> <b id="s-level">1</b></span><span id="s-xptext">0 / 100 XP</span></div>
    <div class="xpbar"><i id="s-xpfill"></i></div>
  </div>
  <button class="primary" id="btn-play" data-i18n="play">PLAY</button>
  <div class="row">
    <button class="ghostbtn" id="btn-unlocks">🛒 <span data-i18n="shop">Shop</span><span id="shop-dot" class="hidden">•</span></button>
    <button class="ghostbtn" id="btn-sound">🔊</button>
    <button class="ghostbtn" id="btn-music">🎵 ON</button>
    <button class="ghostbtn" id="btn-fx">✨ FX: HI</button>
  </div>
  <button class="ghostbtn" id="btn-lang" style="min-height:44px;padding:8px 16px;font-size:14px">🌐 English</button>
  <button class="ghostbtn hidden" id="btn-rebirth">🌀 REBIRTH — permanent XP boost</button>
  <div class="missions" id="s-missions"></div>
  <button class="ghostbtn" id="btn-privacy" style="min-height:40px;padding:8px 14px;font-size:12px;font-weight:400" data-i18n="privacy">Privacy &amp; ad options</button>
</div>

<!-- ── GAME OVER SCREEN ─────────────────────────────────────────────── -->
<div class="screen hidden" id="over">
  <div class="headline" id="o-head"></div>
  <div class="bigscore" id="o-score">0</div>
  <div class="ghost"><span><span data-i18n="best_lower">best</span> <b id="o-bestn">0</b></span><i class="you" id="o-you"></i><i class="mark" id="o-mark"></i></div>
  <div class="statline" id="o-miss"></div>
  <div class="row">
    <button class="ad" id="btn-continue">▶ <span data-i18n="cont">CONTINUE</span><br><small data-i18n="watch_ad_once">watch ad · once</small></button>
    <button class="ad" id="btn-coinrevive">▶ <span data-i18n="cont">CONTINUE</span><br><small>🪙 <span id="o-revcost">60</span></small></button>
    <button class="ad" id="btn-doublexp"><span data-i18n="double_xp">2× XP</span><br><small data-i18n="watch_ad">watch ad</small></button>
  </div>
  <button class="primary" id="btn-retry" data-i18n="play_again">TAP TO PLAY AGAIN</button>
  <!-- progress that carries over: a loss still moves you forward -->
  <div class="carry">
    <div class="carryrow"><span id="o-xp"></span><span id="o-coins"></span></div>
    <div class="xpwrap" style="width:100%">
      <div class="xplabel"><span><span data-i18n="lvl">LVL</span> <b id="o-level">1</b></span><span id="o-xptext"></span></div>
      <div class="xpbar"><i id="o-xpfill"></i></div>
    </div>
    <div class="missions" id="o-missions" style="width:100%"></div>
  </div>
  <button class="ghostbtn" id="btn-home" style="min-height:40px;padding:8px 18px;font-size:14px" data-i18n="home">Home</button>
</div>

<!-- ── OPTIONAL EMAIL INVITE (web only, see Crew below) ────────────── -->
<div id="crew" class="hidden" role="dialog" aria-labelledby="crew-h">
  <button class="x" id="crew-x" type="button" aria-label="Close">✕</button>
  <h3 id="crew-h"></h3>
  <p id="crew-p"></p>
  <form id="crew-form" novalidate>
    <input type="email" id="crew-email" name="email" autocomplete="email" inputmode="email" enterkeyhint="send" required>
    <input class="hp" type="text" id="crew-hp" name="bot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="go" id="crew-go" type="submit"></button>
  </form>
  <div class="msg" id="crew-msg"></div>
  <div class="fine"><span><span id="crew-fine"></span> <a id="crew-pv" href="https://ets-games.netlify.app/privacy/" target="_blank" rel="noopener"></a></span><button class="skip" id="crew-skip" type="button"></button></div>
</div>

<!-- ── PAUSE SCREEN ─────────────────────────────────────────────────── -->
<div class="screen hidden" id="pause">
  <h1 class="logo" style="font-size:34px" data-i18n="paused">PAUSED</h1>
  <button class="primary" id="btn-resume" data-i18n="resume">RESUME</button>
  <div class="row">
    <button class="ghostbtn" id="btn-p-restart" data-i18n="restart">Restart</button>
    <button class="ghostbtn" id="btn-p-home" data-i18n="home">Home</button>
  </div>
</div>

<!-- ── SHOP SCREEN ──────────────────────────────────────────────────── -->
<div class="screen hidden" id="unlocks">
  <h1 class="logo" style="font-size:30px" data-i18n="shop_title">SHOP</h1>
  <div class="statline">🪙 <b id="u-coins">0</b> · <span data-i18n="lifetime_xp">lifetime XP</span> <b id="u-xp">0</b></div>
  <div class="tabs">
    <button data-tab="trail" class="on" data-i18n="tab_colors">Colors</button>
    <button data-tab="skin" data-i18n="tab_skins">Skins</button>
    <button data-tab="bg" data-i18n="tab_worlds">Worlds</button>
    <button data-tab="sound" data-i18n="tab_sound">Sound</button>
    <button data-tab="fx" data-i18n="tab_fx">FX</button>
    <button data-tab="coins">🪙+</button>
  </div>
  <div class="grid" id="u-grid"></div>
  <div class="dimtxt" data-i18n="shop_help">XP unlocks a tier · coins buy it. Tap an owned item to equip (sound &amp; FX preview on tap). New styles generate forever.</div>
  <button class="ghostbtn" id="btn-u-back" data-i18n="back">Back</button>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   ██  ORBIT RUSH — CONFIG BLOCK  ██
   Every tuning constant and every ad ID lives HERE and only here.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── ADS (Google OFFICIAL TEST IDs — safe in dev, must not ship) ────
     Plugin: @capacitor-community/admob PINNED to 7.2.0 in package.json.
     The rewarded/interstitial event names used below are v7-specific
     (v8 renames them) — do not bump the major without updating Ads. ── */
  ADMOB_APP_ID:          "ca-app-pub-3940256099942544~3347511713", // TODO: replace before release (also in AndroidManifest.xml + capacitor.config.json!)
  BANNER_AD_UNIT_ID:     "ca-app-pub-3940256099942544/6300978111", // TODO: replace before release
  INTERSTITIAL_AD_UNIT_ID:"ca-app-pub-3940256099942544/1033173712",// TODO: replace before release
  REWARDED_AD_UNIT_ID:   "ca-app-pub-3940256099942544/5224354917", // TODO: replace before release
  ADS_ENABLED: true,            // master kill-switch for all ad code
  ADS_TESTING_MODE: true,       // requests test ads; set false for release
  ADS_INTERSTITIAL_EVERY_N_DEATHS: 3, // ⚖ revenue-vs-retention knob #1
  ADS_INTERSTITIAL_MIN_INTERVAL_S: 60,// never two interstitials within 60s
  REWARDED_DOUBLE_XP_MULT: 2,   // ⚖ revenue-vs-retention knob #2

  /* ── XP / LEVELS (endless: cost = BASE_XP · level^EXPONENT) ───────── */
  BASE_XP: 90,
  XP_LEVEL_EXPONENT: 1.5,
  XP_PER_POINT: 10,             // run score → XP conversion
  REBIRTH_LEVEL: 50,            // rebirth offered at/after this level
  REBIRTH_MULT_GAIN: 0.5,       // each rebirth: +0.5× permanent XP gain
  STREAK_BONUS_PER_DAY: 0.10,   // +10% XP per streak day…
  STREAK_BONUS_CAP: 1.0,        // …capped at +100%
  STREAK_DAILY_XP: 40,          // instant XP on first launch of the day × streak

  /* ── DIFFICULTY — smooth functions of rings-passed n and level L.
        No tiers: level 3 and level 300 use the same math, chaos clamped. */
  /* n is RINGS PASSED this run (not score), so combo points no longer
     speed the game up — playing well isn't punished. */
  EASY_RINGS: 5,                // first N rings: static, big, no flips
  ORBIT_SPEED_BASE: 1.85,       // rad/s at n=0            ★ addictiveness knob
  ORBIT_SPEED_GROWTH: 0.045,    // + per ring passed        ★ addictiveness knob
  ORBIT_SPEED_LEVEL: 0.018,     // + ·√L (veterans start a touch faster)
  ORBIT_SPEED_MAX: 4.6,         // CLAMP: playable forever
  FLY_SPEED: 760,               // px/s (in 480-wide virtual units)
  ORBIT_GAP: 26,                // dot's orbit sits this far outside the ring
  DOT_R: 9,

  TARGET_R_BASE: 56,            // ring radius at n=0
  TARGET_R_SHRINK: 2.6,         // − ·√n
  TARGET_R_LEVEL: 0.5,          // − ·√L
  TARGET_R_MIN: 30,             // CLAMP ★ addictiveness knob
  TARGET_DIST_MIN: 170,         // spawn distance range from current ring
  TARGET_DIST_MAX: 250,
  TARGET_CONE_DEG: 52,          // spawn direction: up ± this many degrees

  FLIP_START_N: 6,              // rotation may flip after this many rings
  FLIP_CHANCE_GROWTH: 0.012,    // + per ring past start
  FLIP_CHANCE_LEVEL: 0.002,     // + per level
  FLIP_CHANCE_MAX: 0.35,        // CLAMP ★ addictiveness knob

  MOVE_START_N: 8,              // targets start moving after this many rings
  MOVE_AMP_GROWTH: 2.2,         // px amplitude per ring past start
  MOVE_AMP_MAX: 46,             // CLAMP
  MOVE_SPEED_BASE: 1.1,         // rad/s oscillation
  MOVE_SPEED_MAX: 2.2,          // CLAMP

  /* ── SCORING / FEEL ───────────────────────────────────────────────── */
  PERFECT_FRACTION: 0.55,       // hit within r·this = PERFECT ★ knob (was 0.38)
  PERFECT_FRACTION_EARLY: 0.68, // even friendlier during the EASY_RINGS warm-up

/* language selection: ?lang= link (from the ETS site) > player's choice in
   the game > the ETS site's saved choice (same-origin only) > device > en */
const Lang={
  LIST:["en","es","pt-BR","id","fil"],
  NAMES:{en:"English",es:"Español","pt-BR":"Português",id:"Indonesia",fil:"Filipino"},
  cur:"en",
  norm(code){
    if(!code) return null;
    const c=String(code).trim().replace("_","-").toLowerCase();
    if(c.startsWith("pt")) return "pt-BR";
    if(c.startsWith("es")) return "es";
    if(c==="id"||c==="in"||c.startsWith("id-")||c.startsWith("in-")) return "id";
    if(c.startsWith("fil")||c==="tl"||c.startsWith("tl-")) return "fil";
    if(c.startsWith("en")) return "en";
    return null;
  },
  init(){
    let fromUrl=null;
    try{ fromUrl=this.norm(new URLSearchParams(location.search).get("lang")); }catch(e){}
    if(fromUrl) S.lang=fromUrl;                       // a link from the site wins, and sticks
    let site=null; try{ site=this.norm(localStorage.getItem("ets.lang")); }catch(e){}
    let dev=null;
    for(const l of (navigator.languages||[navigator.language])){ dev=this.norm(l); if(dev) break; }
    this.cur=fromUrl||this.norm(S.lang)||site||dev||"en";
    document.documentElement.lang=this.cur;
  },
  set(code){ this.cur=code; S.lang=code; save(); document.documentElement.lang=code; UI.applyLang(); },
  next(){ const i=this.LIST.indexOf(this.cur); this.set(this.LIST[(i+1)%this.LIST.length]); },
};
/* tr("key",{n:3}) → translated string with {placeholders} filled */
function tr(key,vars){
  const s=(STR[Lang.cur]&&STR[Lang.cur][key])??STR.en[key]??key;
  if(!vars||typeof s!=="string") return s;
  return s.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!==undefined?vars[k]:m);
}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════════════ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
/* Deterministic hash → [0,1). Used to procedurally generate unlock styles,
   milestone titles etc. so they're stable across sessions with no data. */
function hash01(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const $=id=>document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════════
   SAVE / LOAD — everything persists in one localStorage JSON blob.
   ═══════════════════════════════════════════════════════════════════════ */
const DEFAULT_SAVE={
  v:1,
  level:1, xpInLevel:0,        // current level + progress into it
  lifetimeXP:0,                // never resets (drives unlocks)
  rebirths:0,                  // permanent XP multiplier count
  best:0, lastRun:0,
  runsPlayed:0, ringsTotal:0, perfectsTotal:0,
  deaths:0,                    // interstitial cadence counter
  streak:0, lastDay:"",        // daily streak
  missions:[],                 // active missions (see Missions)
  missionSeed:1,               // monotonically increasing mission generator seed
  coins:0,                     // spendable currency (earned per run)
  removeAds:false,             // non-consumable IAP: banner+interstitial off
  iapGranted:[],               // purchase tokens already paid out (coin packs), newest last
  /* item 0 of every category is free & pre-owned */
  owned:{trail:[0],skin:[0],bg:[0],sound:[0],fx:[0]},
  equip:{trail:0,skin:0,bg:0,sound:0,fx:0},
  shopSeen:{trail:1,skin:1,bg:1,sound:1,fx:1}, // per-category count seen → NEW badges
  muted:false, lowFX:false, musicOn:true,
  lang:"",                     // "" = follow ?lang= link / ETS site / device
  consentDone:false,
  crew:{sess:0,last:-99,closes:0,done:false}, // email invite: visits, visit last shown, times closed, joined
};
const SHOP_CATS=["trail","skin","bg","sound","fx"];
let S=loadSave();
function loadSave(){
  try{
    const raw=localStorage.getItem(CONFIG.SAVE_KEY);
    if(!raw) return structuredClone(DEFAULT_SAVE);
    // Merge over defaults so adding fields in updates never breaks old saves.
    const s=Object.assign(structuredClone(DEFAULT_SAVE), JSON.parse(raw));
    // nested objects need their own merge (a shallow assign would drop
    // newly added categories like sound/fx from pre-shop saves)
    for(const k of ["owned","equip","shopSeen","crew"])
      s[k]=Object.assign(structuredClone(DEFAULT_SAVE[k]), s[k]||{});
    if(!Array.isArray(s.iapGranted)) s.iapGranted=[];
    // never leave an un-owned item equipped
    for(const c of SHOP_CATS) if(!s.owned[c].includes(s.equip[c])) s.equip[c]=0;
    return s;
  }catch(e){ console.warn("[save] corrupt, resetting", e); return structuredClone(DEFAULT_SAVE); }
}
let saveQueued=false;
function save(){ // micro-batched: many systems call save(); write once per frame
  if(saveQueued) return; saveQueued=true;
  setTimeout(()=>{ saveQueued=false;
    try{ localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(S)); }
    catch(e){ console.warn("[save] write failed", e); }
  },0);
}

/* XP cost of a given level — endless curve, never plateaus. */
const xpForLevel=l=>Math.round(CONFIG.BASE_XP*Math.pow(l,CONFIG.XP_LEVEL_EXPONENT));
/* Total permanent XP-gain multiplier (rebirth + streak). */
function xpMult(){
  const streakBonus=Math.min(CONFIG.STREAK_BONUS_CAP, S.streak*CONFIG.STREAK_BONUS_PER_DAY);
  return (1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN)*(1+streakBonus);
}

/* ═══════════════════════════════════════════════════════════════════════
   AUDIO — 100% procedural Web Audio, no files. Context is created lazily
   on the first user gesture (mobile autoplay policy), suspended on pause.
   ═══════════════════════════════════════════════════════════════════════ */
const Audio2={
  ctx:null, master:null,
  ensure(){
    if(S.muted) return null;
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.5;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state==="suspended") this.ctx.resume();
    return this.ctx;
  },
  suspend(){ if(this.ctx&&this.ctx.state==="running") this.ctx.suspend(); },
  /* iOS WebKit only fully unlocks output once a sound actually starts
     inside a gesture — play one silent sample the first time. */
  unlockIOS(){
    if(this.iosUnlocked||!this.ctx) return;
    try{ const src=this.ctx.createBufferSource(); src.buffer=this.ctx.createBuffer(1,1,22050);
      src.connect(this.ctx.destination); src.start(0); this.iosUnlocked=true; }catch(e){}
  },
  /* one-shot helper: oscillator with pitch+gain envelopes */
  blip(freq0,freq1,dur,type,vol,when=0){
    const ctx=this.ensure(); if(!ctx) return;
    const t=ctx.currentTime+when;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(freq1,1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,cutoff,when=0){
    const ctx=this.ensure(); if(!ctx) return;
    const t=ctx.currentTime+when;
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff;
    const g=ctx.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  /* equipped sound pack (see soundItem) drives the pluck/thunk voice */
  pack(){ return soundItem(S.equip.sound); },
  /* landed in a ring — weighty "thunk", pitched by the pack */
  thunk(){
    const p=this.pack();
    this.noise(0.08,0.5,900);
    this.blip(150*(p.base/523),60,0.12,"sine",0.5);
  },
  /* PERFECT — pluck that climbs the pack's scale with the combo:
     the escalating-audio dopamine ramp. */
  perfect(combo,packOverride){
    const p=packOverride||this.pack();
    const st=p.scale[Math.min(combo-1,p.scale.length-1)];
    const f=p.base*Math.pow(2,st/12);
    this.blip(f,f,0.16,p.wave,0.5);
    this.blip(f*2,f*2,0.10,"sine",0.22,0.02);      // sparkle octave
    if(combo>=3) this.blip(f*1.5,f*1.5,0.12,"sine",0.18,0.05);
  },
  /* shop preview: a short 3-note run in pack i's voice */
  preview(i){ const p=soundItem(i); this.perfect(1,p); setTimeout(()=>this.perfect(2,p),100); setTimeout(()=>this.perfect(3,p),200); },
  miss(){ this.blip(300,55,0.4,"sawtooth",0.35); this.noise(0.25,0.3,500,0.05); },
  levelup(){ [0,4,7,12].forEach((st,i)=>this.blip(440*Math.pow(2,st/12),440*Math.pow(2,st/12),0.18,"triangle",0.4,i*0.07)); },
  unlock(){ [0,5,9,12,16].forEach((st,i)=>this.blip(523*Math.pow(2,st/12),523*Math.pow(2,st/12),0.15,"square",0.15,i*0.06)); },
  ui(){ this.blip(700,900,0.05,"sine",0.15); },
  release(){ this.blip(220,700,0.09,"sine",0.25); },
  /* sub-bass "boom" under PERFECTs — heavier as the combo climbs */
  boom(combo){ this.blip(120,38,0.28,"sine",Math.min(0.75,0.35+combo*0.05)); this.noise(0.06,0.25+combo*0.03,2400); },
  /* praise-word stinger: a bright major chord, pitched up per tier */
  stinger(tier){ const b=392*Math.pow(2,tier/12); [0,4,7,12].forEach((st,i)=>this.blip(b*Math.pow(2,st/12),b*Math.pow(2,st/12),0.32,"triangle",0.22,i*0.025)); },
  /* mid-run NEW BEST fanfare */
  fanfare(){ [0,4,7,12,16,19,24].forEach((st,i)=>this.blip(523*Math.pow(2,st/12),523*Math.pow(2,st/12),0.2,"square",0.16,i*0.055)); this.boom(6); },
  /* near-miss: a rising "ooh" so a miss feels close, not cheap */
  soClose(){ this.blip(330,520,0.35,"triangle",0.25,0.05); },
};

/* ═══════════════════════════════════════════════════════════════════════
   MUSIC — original procedural soundtrack, 100% Web Audio (no files, no
   licences). A lookahead scheduler queues 16th-notes ~120ms ahead on the
   audio clock, so timing stays tight even when frames drop.
   · "menu" — 100 BPM, soft pads + twinkly arp (home / game over / shop)
   · "game" — 128 BPM four-on-the-floor; layers build with your combo:
              combo 3+ adds a 16th-note arp, FEVER adds 16th hats and a
              high sparkle line. Death sweeps a low-pass down (muffled).
   Rides the same master bus as SFX, so the mute button and app-pause
   (context suspend) cover it. Starts only after a user gesture.
   ═══════════════════════════════════════════════════════════════════════ */
const Music={
  bus:null, filter:null, noiseBuf:null,
  song:null, want:"menu", step:0, nextT:0, timer:null,
  VOL:0.7,
  SONGS:{
    menu:{bpm:100, chords:[[50,"M"],[47,"m"],[43,"M"],[45,"M"]]},   // I–vi–IV–V in D
    game:{bpm:128, chords:[[50,"M"],[45,"M"],[47,"m"],[43,"M"]]},   // I–V–vi–IV in D
  },
  // two-bar lead motif: indexes into the chord's tones (-1 = rest)
  MEL:[[0,-1,2,-1,1,-1,3,-1,2,-1,4,-1,3,-1,2,1],[3,-1,2,-1,4,-1,3,-1,5,-1,4,-1,2,-1,1,-1]],

  enabled(){ return !S.muted && S.musicOn!==false; },
  hz(m){ return 440*Math.pow(2,(m-69)/12); },
  tones(ch){ const [r,q]=ch, t=q==="m"?3:4; return [r,r+t,r+7,r+12,r+12+t,r+19,r+24]; },

  setup(ctx){
    if(this.bus) return;
    this.filter=ctx.createBiquadFilter(); this.filter.type="lowpass"; this.filter.frequency.value=18000;
    this.bus=ctx.createGain(); this.bus.gain.value=0;
    // gentle glue compressor: keeps the mix punchy and stops clipping
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.2;
    this.filter.connect(comp); comp.connect(this.bus); this.bus.connect(Audio2.master);
    const n=ctx.sampleRate; this.noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=this.noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  },

  /* switch to a song (crossfade). Safe to call any time; no-op if muted. */
  play(name){
    this.want=name;
    if(!this.enabled()){ this.stop(); return; }
    const ctx=Audio2.ensure(); if(!ctx) return;
    this.setup(ctx);
    const now=ctx.currentTime, f=this.filter.frequency;
    f.cancelScheduledValues(now); f.setValueAtTime(f.value,now); f.linearRampToValueAtTime(18000,now+0.25);
    if(this.song===name&&this.timer) return;           // already playing: just un-muffle
    const g=this.bus.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value,now);
    g.linearRampToValueAtTime(0,now+0.12);
    g.linearRampToValueAtTime(this.VOL,now+0.7);
    this.song=name; this.step=0; this.nextT=now+0.15;
    if(!this.timer) this.timer=setInterval(()=>this.tick(),25);
  },
  stop(){
    clearInterval(this.timer); this.timer=null; this.song=null;
    const ctx=Audio2.ctx; if(!ctx||!this.bus) return;
    const now=ctx.currentTime, g=this.bus.gain;
    g.cancelScheduledValues(now); g.setValueAtTime(g.value,now); g.linearRampToValueAtTime(0,now+0.2);
  },
  /* death: muffle the track for that "oh no" moment */
  /* death: a quick "whoomp" filter dip that springs back — the energy
     stays up so the next run feels one tap away */
  dip(){
    const ctx=Audio2.ctx; if(!ctx||!this.filter) return;
    const now=ctx.currentTime, f=this.filter.frequency;
    f.cancelScheduledValues(now); f.setValueAtTime(f.value,now);
    f.exponentialRampToValueAtTime(700,now+0.15); f.exponentialRampToValueAtTime(18000,now+1.1);
  },

  tick(){
    const ctx=Audio2.ctx;
    if(!ctx||ctx.state!=="running"||!this.song) return;
    if(this.nextT<ctx.currentTime) this.nextT=ctx.currentTime+0.03;   // throttled-tab catch-up
    const song=this.SONGS[this.song], dt=60/song.bpm/4;
    while(this.nextT<ctx.currentTime+0.12){
      this[this.song==="game"?"stepGame":"stepMenu"](this.step,this.nextT,song,dt);
      this.nextT+=dt; this.step++;
    }
  },

  /* ── voices (all scheduled at audio time t) ─────────────────────── */
  osc(f,t,dur,type,vol,att=0.005){
    const ctx=Audio2.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.filter); o.start(t); o.stop(t+dur+0.02);
  },
  noise(t,dur,vol,type,freq,q=1){
    const ctx=Audio2.ctx, s=ctx.createBufferSource(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=this.noiseBuf; fl.type=type; fl.frequency.value=freq; fl.Q.value=q;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.filter);
    s.start(t,Math.random()*0.5); s.stop(t+dur+0.02);
  },
  kick(t,vol=0.9){
    const ctx=Audio2.ctx, o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(165,t); o.frequency.exponentialRampToValueAtTime(45,t+0.14);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(g); g.connect(this.filter); o.start(t); o.stop(t+0.25);
  },
  bass(m,t,dur,vol=0.38){
    const ctx=Audio2.ctx, o=ctx.createOscillator(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
    o.type="sawtooth"; o.frequency.setValueAtTime(this.hz(m),t);
    fl.type="lowpass"; fl.frequency.setValueAtTime(900,t); fl.frequency.exponentialRampToValueAtTime(220,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(fl); fl.connect(g); g.connect(this.filter); o.start(t); o.stop(t+dur+0.02);
  },

  /* ── arrangements ──────────────────────────────────────────────── */
  stepGame(step,t,song,dt){
    const s=step%16, bar=Math.floor(step/16), ch=song.chords[bar%song.chords.length], T=this.tones(ch);
    const combo=Game.state==="playing"||Game.state==="dying"?Game.combo:1;
    const fever=combo>=CONFIG.JUICE_FEVER_COMBO;
    if(s%4===0) this.kick(t);
    if(s===4||s===12) this.noise(t,0.14,0.6,"bandpass",1700,0.8);          // clap
    if(s%4===2) this.noise(t,0.05,0.25,"highpass",7500);                    // open-ish hat
    else if(fever&&s%2===1) this.noise(t,0.025,0.14,"highpass",9000);       // fever 16ths
    if(s===0||s===3||s===6||s===10||s===12) this.bass(ch[0]-12,t,dt*1.8);
    else if(s===8) this.bass(ch[0],t,dt*1.5);
    else if(s===14) this.bass(ch[0]-5,t,dt*1.5);
    const mi=this.MEL[bar%2][s];                                            // lead hook
    if(mi>=0) this.osc(this.hz(T[mi]+12),t,dt*1.7,"triangle",0.24);
    if(combo>=3) this.osc(this.hz(T[[0,1,2,3,2,1,3,4][s%8]]+24),t,dt*0.9,"square",0.08);  // arp layer
    if(fever&&s%2===0) this.osc(this.hz(T[[3,4,5,6][(s/2)%4]]+24),t,dt*1.2,"sine",0.12);   // sparkle
    if(s===0) for(const m of [T[0],T[1],T[2]]) this.osc(this.hz(m+12),t,dt*15,"sawtooth",0.03,0.08); // soft pad
  },
  stepMenu(step,t,song,dt){
    const s=step%16, bar=Math.floor(step/16), ch=song.chords[bar%song.chords.length], T=this.tones(ch);
    if(s===0) this.kick(t,0.45);
    if(s===8) this.kick(t,0.3);
    if(s%4===2) this.noise(t,0.04,0.06,"highpass",8000);
    if(s===0) this.bass(ch[0]-12,t,dt*7,0.3);
    if(s===0) for(const m of [T[0],T[1],T[2]]) this.osc(this.hz(m+12),t,dt*16,"triangle",0.11,0.35);  // pad
    if(s%2===0) this.osc(this.hz(T[[0,2,4,3,5,4,2,3][(s/2)%8]]+12),t,dt*2.5,"triangle",0.17);           // arp
    if(bar%2===1&&(s===6||s===14)) this.osc(this.hz(T[6]),t,dt*3,"sine",0.12);                           // twinkle
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   HAPTICS — Capacitor Haptics when native, navigator.vibrate fallback,
   silent no-op in a desktop browser.
   ═══════════════════════════════════════════════════════════════════════ */
const Haptics={
  plugin(){ return window.Capacitor?.Plugins?.Haptics || null; },
  tap(){    const p=this.plugin(); if(p) p.impact({style:"LIGHT"}).catch(()=>{}); else navigator.vibrate?.(10); },
  hit(){    const p=this.plugin(); if(p) p.impact({style:"MEDIUM"}).catch(()=>{}); else navigator.vibrate?.(20); },
  perfect(){const p=this.plugin(); if(p) p.notification({type:"SUCCESS"}).catch(()=>{}); else navigator.vibrate?.([15,30,15]); },
  death(){  const p=this.plugin(); if(p) p.vibrate({duration:120}).catch(()=>{}); else navigator.vibrate?.(120); },
};

/* Keep the screen on during a run; let it sleep in menus. */
const Awake={
  p(){ return window.Capacitor?.Plugins?.KeepAwake || null; },
  on(){ this.p()?.keepAwake().catch(()=>{}); },
  off(){ this.p()?.allowSleep().catch(()=>{}); },
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UNLOCKS — hand-authored classics first, then procedurally generated
   forever (golden-angle hues + word-list names), so unlocks never dry up.
   Everything is derived from the index → nothing to store but thresholds.
   ═══════════════════════════════════════════════════════════════════════ */
const WORDS_A=["Neon","Void","Solar","Ember","Frost","Quantum","Retro","Hyper","Lunar","Astro","Plasma","Crystal","Turbo","Phantom","Aurora","Cosmic"];
const WORDS_B=["Drift","Pulse","Flare","Echo","Storm","Bloom","Shard","Wave","Core","Halo","Spark","Trail","Rush","Glow","Orbit","Shift"];
function procName(i){ return WORDS_A[Math.floor(hash01(i*3+1)*WORDS_A.length)]+" "+WORDS_B[Math.floor(hash01(i*7+2)*WORDS_B.length)]; }
function procHue(i){ return Math.round(i*137.508)%360; }   // golden angle → well-spread hues

/* Bright, saturated "candy" set — every colour has to pop on the vivid
   default worlds, so no pastels or dark tones in the hand-made tiers. */
const HAND_TRAILS=[
  {name:"Sunburst", c:"#ffd23f"}, {name:"Hot Pink", c:"#ff3ea5"},
  {name:"Cyan",     c:"#00f0ff"}, {name:"Mint",     c:"#3dffb4"},
  {name:"Tangerine",c:"#ff8a1f"}, {name:"Lime",     c:"#b6ff2e"},
  {name:"Cherry",   c:"#ff2e4d"}, {name:"Snow",     c:"#ffffff"},
];
const SKIN_SHAPES=["dot","ring","square","diamond","comet","star","eye","tri"];
const HAND_SKINS=[
  {name:"Classic", shape:"dot",    c:"#ffffff"}, {name:"Halo",   shape:"ring",   c:"#5ef2c8"},
  {name:"Cube",    shape:"square", c:"#ffc94d"}, {name:"Gem",    shape:"diamond",c:"#38b6ff"},
  {name:"Comet",   shape:"comet",  c:"#ff5e8a"}, {name:"Star",   shape:"star",   c:"#fff59d"},
  {name:"Watcher", shape:"eye",    c:"#a78bfa"}, {name:"Dart",   shape:"tri",    c:"#a3e635"},
];
const HAND_BGS=[
  {name:"Hyperdrive", top:"#2f6bff", bot:"#8a3cff"}, {name:"Bubblegum", top:"#ff4fa0", bot:"#ff9a3c"},
  {name:"Lagoon",     top:"#00b8d4", bot:"#2f6bff"}, {name:"Grape Soda",top:"#7b2cff", bot:"#ff3ea5"},
  {name:"Jungle",     top:"#10c46b", bot:"#0a7fa8"}, {name:"Electric",  top:"#00a8ff", bot:"#6a1bff"},
  {name:"Sunrise",    top:"#ff6a3d", bot:"#ff2e88"}, {name:"Deep Space",top:"#0b0d1a", bot:"#141a3a"}, // dark option for night play
];
/* Item i of a category — hand-authored if available, else generated. */
function trailItem(i){
  if(i<HAND_TRAILS.length) return HAND_TRAILS[i];
  return {name:procName(i), c:`hsl(${procHue(i)} 100% 62%)`};
}
function skinItem(i){
  if(i<HAND_SKINS.length) return HAND_SKINS[i];
  return {name:procName(i+50), shape:SKIN_SHAPES[i%SKIN_SHAPES.length], c:`hsl(${procHue(i+9)} 85% 70%)`};
}
function bgItem(i){
  if(i<HAND_BGS.length) return HAND_BGS[i];
  const h=procHue(i+17);
  return {name:procName(i+99), top:`hsl(${h} 90% 56%)`, bot:`hsl(${(h+45)%360} 85% 46%)`};
}
/* ── sound packs: swap the pluck/thunk voice. Hand-authored, then
      procedural (wave/base/scale derived from the index) forever. ───── */
const HAND_SOUNDS=[
  {name:"Classic", wave:"triangle", base:523, scale:[0,3,5,7,10,12,15,17]},   // minor pentatonic
  {name:"8-Bit",   wave:"square",   base:440, scale:[0,4,7,12,16,19,24,28]},  // major arps
  {name:"Laser",   wave:"sawtooth", base:392, scale:[0,2,7,9,14,16,21,23]},   // sus2 stacks
  {name:"Glass",   wave:"sine",     base:784, scale:[0,4,6,11,12,16,18,23]},  // lydian shimmer
];
const WAVES=["triangle","square","sawtooth","sine"];
function soundItem(i){
  if(i<HAND_SOUNDS.length) return HAND_SOUNDS[i];
  return {name:procName(i+201), wave:WAVES[i%WAVES.length],
    base:Math.round(330*Math.pow(2,hash01(i*11+4)*1.2)),
    scale:HAND_SOUNDS[Math.floor(hash01(i*5+9)*HAND_SOUNDS.length)].scale};
}
/* ── FX packs: perfect-hit explosion variants (see Particles.perfectFX).
      Hand-authored styles, then procedural style+hue recombinations. ── */
const HAND_FX=[
  {name:"Shatter",  style:"shatter"},
  {name:"Nova",     style:"nova"},
  {name:"Implode",  style:"implode"},
  {name:"Confetti", style:"confetti"},
  {name:"Quake",    style:"quake"},
];
function fxItem(i){
  if(i<HAND_FX.length) return HAND_FX[i];
  return {name:procName(i+301), style:HAND_FX[i%HAND_FX.length].style, hue:procHue(i+23)};
}
const CAT_ITEM={trail:trailItem,skin:skinItem,bg:bgItem,sound:soundItem,fx:fxItem};

/* Lifetime-XP threshold of the i-th unlock in any category (i=0 free). */
function unlockCost(i){ return i===0?0:Math.round(CONFIG.UNLOCK_BASE*Math.pow(i,CONFIG.UNLOCK_EXPONENT)); }
/* Coin price of the i-th shop item — tier-scaled, endless. XP makes an
   item AVAILABLE (unlockCost), coins BUY it (hybrid model). */
function coinPrice(i){ return i===0?0:Math.round(CONFIG.COIN_PRICE_BASE*Math.pow(i,CONFIG.COIN_PRICE_EXPONENT)/5)*5; }
function unlockedCount(){ // how many items per category current lifetime XP grants
  let i=0; while(unlockCost(i+1)<=S.lifetimeXP && i<9999) i++;
  return i+1;
}
/* Detect newly crossed thresholds after an XP gain → NEW UNLOCK banner. */
function checkNewUnlocks(prevLifetime){
  let iPrev=0; while(unlockCost(iPrev+1)<=prevLifetime) iPrev++;
  let iNow=0;  while(unlockCost(iNow+1)<=S.lifetimeXP)  iNow++;
  for(let i=iPrev+1;i<=iNow;i++){
    UI.toast(tr("new_in_shop",{name:trailItem(i).name}), true);
    Audio2.unlock(); Haptics.perfect();
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   MISSIONS — 3 active, procedurally generated & scaled to the player,
   refresh automatically when completed. Progress survives restarts.
   ═══════════════════════════════════════════════════════════════════════ */
const Missions={
  TYPES:["score","perfectRow","rings","runs","level","rebirth"],
  /* text is built when shown, so it follows the language setting
     (old saves carried an English txt field, which is now ignored) */
  text(m){
    if(m.t==="rebirth") return tr(m.again?"m_rebirth_again":"m_rebirth_once");
    return tr("m_"+m.t,{n:m.n});
  },
  key(m){ return m.t+":"+m.n; },
  gen(seed){
    const lvl=S.level, t=this.TYPES[Math.floor(hash01(seed*13+5)*this.TYPES.length)];
    const r=hash01(seed*29+11);
    switch(t){
      case "score":      { const n=Math.max(5, Math.round((S.best||5)*(0.6+r*0.8))); return {t,n,p:0,xp:n*15}; }
      case "perfectRow": { const n=3+Math.floor(r*3)+Math.floor(lvl/20); return {t,n,p:0,xp:n*60}; }
      case "rings":      { const n=30+Math.floor(r*40)+lvl*2; return {t,n,p:0,xp:n*6}; }
      case "runs":       { const n=3+Math.floor(r*5); return {t,n,p:0,xp:n*40}; }
      case "level":      { const n=lvl+1+Math.floor(r*3); return {t,n,p:0,xp:n*30}; }
      case "rebirth":    { return {t,n:S.rebirths+1,p:0,again:S.rebirths>0,xp:1500}; }
    }
  },
  ensure(){
    while(S.missions.length<3){
      // level-gate the rebirth mission so new players don't see it
      let m=this.gen(S.missionSeed++);
      if(m.t==="rebirth"&&S.level<CONFIG.REBIRTH_LEVEL*0.6) m=this.gen(S.missionSeed++);
      S.missions.push(m);
    }
    save();
  },
  /* remember progress at run start so the over screen can show gains */
  snapshot(){ this.before=new Map(S.missions.map(m=>[this.key(m),m.p])); },
  /* event: {score?, perfectRow?, ring?, run?, level?, rebirth?} */
  progress(ev){
    let changed=false;
    for(const m of S.missions){
      const before=m.p;
      if(m.t==="score"&&ev.score!==undefined)           m.p=Math.max(m.p,ev.score);
      if(m.t==="perfectRow"&&ev.perfectRow!==undefined) m.p=Math.max(m.p,ev.perfectRow);
      if(m.t==="rings"&&ev.ring)                        m.p+=1;
      if(m.t==="runs"&&ev.run)                          m.p+=1;
      if(m.t==="level"&&ev.level!==undefined)           m.p=Math.max(m.p,ev.level);
      if(m.t==="rebirth"&&ev.rebirth!==undefined)       m.p=Math.max(m.p,ev.rebirth);
      if(m.p!==before) changed=true;
    }
    // complete & replace
    for(let i=S.missions.length-1;i>=0;i--){
      const m=S.missions[i];
      if(m.p>=m.n){
        S.missions.splice(i,1);
        UI.toast(tr("mission_done",{txt:this.text(m),xp:m.xp}), true);
        Audio2.unlock();
        Progress.gainXP(m.xp, true); // mission XP skips run multipliers
        changed=true;
      }
    }
    if(changed){ this.ensure(); UI.renderMissions(); if(Game.state==="over") UI.renderMissions("o-missions",true); save(); }
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   PARTICLES — fixed-size pool, zero allocation per frame. Two kinds:
   0 = spark (filled circle), 1 = shard (ring fragment arc, for the
   ring-shatter effect on PERFECT hits).
   ═══════════════════════════════════════════════════════════════════════ */
const Particles={
  pool:[], n:0,
  init(){
    for(let i=0;i<CONFIG.PARTICLE_POOL;i++)
      this.pool.push({on:false,kind:0,x:0,y:0,vx:0,vy:0,life:0,maxLife:1,size:2,rot:0,vr:0,arc:0,r:0,color:"#fff"});
  },
  spawn(kind,x,y,vx,vy,life,size,color,r=0,arc=0){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on){
        p.on=true;p.kind=kind;p.x=x;p.y=y;p.vx=vx;p.vy=vy;
        p.life=life;p.maxLife=life;p.size=size;p.color=color;
        p.r=r;p.arc=arc;p.rot=rand(0,TAU);p.vr=rand(-4,4);
        return;
      }
    }
  },
  burst(x,y,color,n,speed){
    const count=Game.lowFX()?Math.ceil(n/2):n;
    for(let i=0;i<count;i++){
      const a=rand(0,TAU), s=rand(speed*0.3,speed);
      this.spawn(0,x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.3,0.7),rand(1.5,3.5),color);
    }
  },
  /* ring explodes into arc fragments that fly outward, spinning */
  shatter(x,y,r,color){
    const frags=Game.lowFX()?5:9;
    for(let i=0;i<frags;i++){
      const a=(i/frags)*TAU;
      this.spawn(1,x+Math.cos(a)*r,y+Math.sin(a)*r,
        Math.cos(a)*rand(60,160),Math.sin(a)*rand(60,160),
        rand(0.4,0.8),3,color,r*0.35,TAU/frags*0.8);
    }
  },
  /* perfect-hit effect, dispatched by the equipped FX pack (shop item).
     All variants reuse the same pool — no new allocation paths. */
  perfectFX(x,y,r,color,fxOverride){
    const fx=fxOverride??fxItem(S.equip.fx);
    const c=fx.hue!==undefined?`hsl(${fx.hue} 90% 65%)`:color;
    switch(fx.style){
      case "nova":       // two concentric spark waves
        for(let i=0;i<(Game.lowFX()?8:14);i++){
          const a=i/14*TAU;
          this.spawn(0,x,y,Math.cos(a)*220,Math.sin(a)*220,0.5,3,c);
          this.spawn(0,x,y,Math.cos(a+0.2)*120,Math.sin(a+0.2)*120,0.7,2,"#ffffff");
        }
        break;
      case "implode":    // sparks collapse into the ring center
        for(let i=0;i<(Game.lowFX()?8:14);i++){
          const a=rand(0,TAU), d=r*rand(1.6,2.4);
          this.spawn(0,x+Math.cos(a)*d,y+Math.sin(a)*d,-Math.cos(a)*d*2.2,-Math.sin(a)*d*2.2,0.45,2.5,c);
        }
        break;
      case "confetti":   // multicolor scatter
        for(let i=0;i<(Game.lowFX()?9:16);i++){
          const a=rand(0,TAU), s=rand(70,240);
          this.spawn(0,x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.4,0.8),rand(2,4),`hsl(${rand(0,360)} 90% 65%)`);
        }
        break;
      case "quake":      // shatter + heavy shake + white flash sparks
        this.shatter(x,y,r,c);
        this.burst(x,y,"#ffffff",10,260);
        Game.fx.shake=Math.max(Game.fx.shake,0.9);
        break;
      default:           // "shatter" — the classic
        this.shatter(x,y,r,c);
    }
  },
  update(dt){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on) continue;
      p.life-=dt;
      if(p.life<=0){p.on=false;continue;}
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vx*=0.985; p.vy*=0.985;
      p.rot+=p.vr*dt;
    }
  },
  draw(ctx,camY){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on) continue;
      const a=p.life/p.maxLife;
      ctx.globalAlpha=a;
      if(p.kind===0){
        ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y-camY,p.size*a+0.5,0,TAU); ctx.fill();
      }else{
        ctx.strokeStyle=p.color; ctx.lineWidth=3*a+1;
        ctx.beginPath(); ctx.arc(p.x,p.y-camY,p.r,p.rot,p.rot+p.arc); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  },
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   PROGRESS — XP, endless levels, rebirth, streak, milestone celebrations.
   ═══════════════════════════════════════════════════════════════════════ */
const Progress={
  /* Grant XP. raw=true skips run multipliers (missions/daily bonuses). */
  gainXP(amount, raw=false){
    const gained=Math.round(raw?amount:amount*xpMult());
    if(gained<=0) return 0;
    const prevLifetime=S.lifetimeXP;
    S.lifetimeXP+=gained;
    S.xpInLevel+=gained;
    while(S.xpInLevel>=xpForLevel(S.level)){
      S.xpInLevel-=xpForLevel(S.level);
      S.level++;
      this.celebrateLevel(S.level);
      Missions.progress({level:S.level});
    }
    checkNewUnlocks(prevLifetime);
    save();
    return gained;
  },
  /* Level-up juice: DOM flash + rising number, canvas chromatic pulse,
     arpeggio, haptic. Milestones (10/25/100 multiples) get procedurally
     generated titles so they never run out. */
  celebrateLevel(lvl){
    Audio2.levelup(); Haptics.perfect();
    UI.levelFx(lvl);
    Game.fx.chroma=1;
    if(lvl%100===0)      { UI.toast(tr("lvl_100",{title:this.milestoneTitle(lvl),n:lvl}), true); Game.fx.shake=1; }
    else if(lvl%25===0)  { UI.toast(tr("lvl_25",{title:this.milestoneTitle(lvl),n:lvl}), true); }
    else if(lvl%10===0)  { UI.toast(tr("lvl_10",{title:this.milestoneTitle(lvl),n:lvl})); }
    if(lvl>=CONFIG.REBIRTH_LEVEL) UI.refreshHome();
  },
  /* Procedural milestone titles: seeded from the level number, infinite. */
  milestoneTitle(lvl){
    const RANKS=["Pilot","Drifter","Voyager","Slingshot","Comet","Meteor","Pulsar","Quasar","Nova","Singularity"];
    return WORDS_A[Math.floor(hash01(lvl*31+7)*WORDS_A.length)]+" "+RANKS[Math.floor(hash01(lvl*17+3)*RANKS.length)];
  },
  /* Daily streak — called once at boot. */
  checkDaily(){
    const d=new Date();
    const today=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    if(S.lastDay===today) return;
    const y=new Date(d.getTime()-864e5);
    const yesterday=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    S.streak=(S.lastDay===yesterday)?S.streak+1:1;
    S.lastDay=today;
    const bonus=CONFIG.STREAK_DAILY_XP*Math.min(S.streak,10);
    UI.toast(tr("streak_toast",{n:S.streak,xp:bonus}), S.streak>1);
    this.gainXP(bonus, true);
    save();
  },
  rebirthAvailable(){ return S.level>=CONFIG.REBIRTH_LEVEL; },
  /* Optional prestige reset: level/XP → 1, permanent multiplier up.
     Lifetime XP (and thus unlocks), best score, streak all KEPT. */
  rebirth(){
    if(!this.rebirthAvailable()) return;
    S.rebirths++; S.level=1; S.xpInLevel=0;
    Missions.progress({rebirth:S.rebirths});
    UI.toast(tr("rebirth_done",{n:S.rebirths,m:(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)}), true);
    Audio2.unlock(); Haptics.perfect();
    save(); UI.refreshHome();
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   GAME — core loop. World is in "virtual units": width is always
   CONFIG.VIRTUAL_W (480), height varies with aspect ratio. One finger,
   one verb: tap = release the orbiting dot.
   ═══════════════════════════════════════════════════════════════════════ */
const Game={
  canvas:null, ctx:null,
  dpr:1, scale:1, vw:480, vh:800,      // virtual view size
  safeTop:0, safeBottom:0,             // safe-area + banner, in virtual units
  state:"menu",                        // menu | playing | dying | over | paused
  camY:0,
  time:0, lastT:0, running:false,

  // run state
  score:0, combo:1, perfectRow:0, revived:false,  // revived = ad-continue used
  coinRevives:0, runPerfects:0,
  runXPGained:0, missMargin:null, flipsSeen:0,

  cur:null, next:null, prevRing:null,  // ring objects
  dot:{x:0,y:0,angle:0,dir:1,omega:2,orbR:80,orbRT:80,mode:"orbit",vx:0,vy:0,trail:[],minDist:1e9},
  dyingT:0,

  fx:{shake:0,chroma:0,hitstop:0,punch:0,scorePop:0,flash:0},
  word:{txt:"",age:9,color:"#fff",size:44},   // big centre praise word
  waves:[],                                   // pooled shockwave rings
  beatBestThisRun:false,
  peakCombo:1,                          // highest combo this run (COMBO_MAX = LEGENDARY)
  stars:null,
  floats:[],                            // pooled floating texts

  lowFX(){ return S.lowFX; },

  init(){
    this.canvas=$("game");
    this.ctx=this.canvas.getContext("2d");
    for(let i=0;i<12;i++) this.floats.push({on:false,x:0,y:0,txt:"",life:0,maxLife:1,color:"#fff",size:16,world:true});
    this.resize();
    window.addEventListener("resize",()=>this.resize());
    // Input: pointerdown covers touch + mouse with zero delay
    // (touch-action:none in CSS suppresses browser gestures).
    this.canvas.addEventListener("pointerdown",e=>{e.preventDefault();this.onTap();},{passive:false});
    window.addEventListener("keydown",e=>{
      if(e.target&&e.target.closest&&e.target.closest("#crew")) return; // typing an email, not playing
      if(e.code==="Space"){e.preventDefault();
        if(this.state==="over"&&performance.now()-(UI.overShownAt||0)>450){ Ads.reviveDeclined(); this.startRun(); }
        else this.onTap();}
      if(e.code==="Escape"&&this.state==="playing") UI.pause();
    });
    this.lastT=performance.now();
    requestAnimationFrame(t=>this.frame(t));
  },

  resize(){
    const cssW=window.innerWidth, cssH=window.innerHeight;
    // A hidden/minimised WebView can report 0×0 during startup; dividing
    // by that poisons vw/vh with NaN and crashes the renderer. Keep the
    // last good size and wait for the next real resize event.
    if(!(cssW>0&&cssH>0)) return;
    // Cap DPR: cheap-GPU phones burn fill-rate fast; lowFX drops to 1.
    this.dpr=S.lowFX?1:Math.min(window.devicePixelRatio||1,CONFIG.DPR_CAP);
    this.canvas.width=Math.round(cssW*this.dpr);
    this.canvas.height=Math.round(cssH*this.dpr);
    // Fit by width on phones (portrait), but never let the view get
    // shorter than VIRTUAL_MIN_H — on tablets/landscape/desktop the world
    // widens instead, so the next ring can't spawn off the top edge.
    this.scale=Math.min(cssW/CONFIG.VIRTUAL_W, cssH/CONFIG.VIRTUAL_MIN_H);
    this.vw=cssW/this.scale;
    this.vh=cssH/this.scale;
    // safe-area probes → virtual units, so the HUD clears notches & banner
    this.safeTop=($("probe-top").offsetHeight||0)/this.scale;
    this.safeBottom=($("probe-bottom").offsetHeight||0)/this.scale;
    this.buildStars();
  },
  buildStars(){
    // Static parallax starfield, generated once per resize (not per frame).
    this.stars=[];
    const n=this.lowFX()?36:80;
    for(let i=0;i<n;i++)
      this.stars.push({x:rand(0,this.vw),y:rand(0,this.vh*1.5),s:rand(0.5,1.8),a:rand(0.15,0.7),p:rand(0.15,0.45)});
  },

  /* ── difficulty: smooth continuous functions, clamped for playability.
        n = rings passed this run, L = player level. Works identically at
        level 3 and level 300 — no tiers, no special cases. ─────────── */
  perfectFrac(n){ return n<CONFIG.EASY_RINGS?CONFIG.PERFECT_FRACTION_EARLY:CONFIG.PERFECT_FRACTION; },
  orbitSpeed(n){ return clamp(CONFIG.ORBIT_SPEED_BASE + CONFIG.ORBIT_SPEED_GROWTH*Math.max(0,n-CONFIG.EASY_RINGS) + CONFIG.ORBIT_SPEED_LEVEL*Math.sqrt(S.level), 0, CONFIG.ORBIT_SPEED_MAX); },
  targetR(n){    if(n<CONFIG.EASY_RINGS) return CONFIG.TARGET_R_BASE;
    return clamp(CONFIG.TARGET_R_BASE - CONFIG.TARGET_R_SHRINK*Math.sqrt(n-CONFIG.EASY_RINGS) - CONFIG.TARGET_R_LEVEL*Math.sqrt(S.level), CONFIG.TARGET_R_MIN, CONFIG.TARGET_R_BASE); },
  flipChance(n){ return n<CONFIG.FLIP_START_N?0:clamp((n-CONFIG.FLIP_START_N)*CONFIG.FLIP_CHANCE_GROWTH + S.level*CONFIG.FLIP_CHANCE_LEVEL, 0, CONFIG.FLIP_CHANCE_MAX); },
  moveAmp(n){    return n<CONFIG.MOVE_START_N?0:clamp((n-CONFIG.MOVE_START_N)*CONFIG.MOVE_AMP_GROWTH, 0, CONFIG.MOVE_AMP_MAX); },
  moveSpeed(n){  return clamp(CONFIG.MOVE_SPEED_BASE + n*0.02, 0, CONFIG.MOVE_SPEED_MAX); },

  makeRing(x,y,r,n){
    return {x,y,baseX:x,r,pf:this.perfectFrac(n),
      moveAmp:this.moveAmp(n),moveSpeed:this.moveSpeed(n),movePhase:rand(0,TAU),
      pulse:0};
  },
  spawnNext(){
    const n=this.rings;
    const dist=rand(CONFIG.TARGET_DIST_MIN,CONFIG.TARGET_DIST_MAX);
    const cone=CONFIG.TARGET_CONE_DEG*Math.PI/180;
    let a=rand(-cone,cone);
    let x=this.cur.x+Math.sin(a)*dist;
    const margin=70;
    if(x<margin||x>this.vw-margin) { a=-a; x=this.cur.x+Math.sin(a)*dist; }
    x=clamp(x,margin,this.vw-margin);
    const y=this.cur.y-Math.cos(a)*dist;
    this.next=this.makeRing(x,y,this.targetR(n),n);
  },

  startRun(){
    this.state="playing";
    this.score=0; this.combo=1; this.peakCombo=1; this.perfectRow=0; this.revived=false;
    this.beatBestThisRun=false; this.word.age=9;
    this.rings=0; this.savesLeft=CONFIG.FREE_SAVES_PER_RUN;
    Missions.snapshot();
    this.coinRevives=0; this.runPerfects=0;
    this.runXPGained=0; this.missMargin=null;
    this.cur=this.makeRing(this.vw/2, 0, CONFIG.TARGET_R_BASE, 0);
    this.camY=this.cur.y-this.vh*0.62;
    this.prevRing=null;
    this.spawnNext();
    const d=this.dot;
    d.mode="orbit"; d.dir=1; d.angle=Math.PI/2; d.omega=this.orbitSpeed(0);
    d.orbR=d.orbRT=this.cur.r+CONFIG.ORBIT_GAP; d.trail.length=0; d.minDist=1e9;
    for(const f of this.floats) f.on=false;
    Awake.on();
    UI.showScreen(null);
    $("btn-pause").style.display="block";
    Music.play("game");
  },

  /* what would a release RIGHT NOW score? Exactly the tangent onTap()
     would launch along, classified by the same classifyShot() the
     capture code scores with. Drives the traffic-light ring tint. */
  predictRelease(){
    const d=this.dot;
    if(d.mode!=="orbit"||!this.next) return null;
    const tx=-Math.sin(d.angle)*d.dir, ty=Math.cos(d.angle)*d.dir;
    return classifyShot(d.x,d.y,tx,ty,this.next);
  },

  onTap(){
    if(this.state!=="playing") return;
    const d=this.dot;
    if(d.mode!=="orbit") return;
    // Release: fly along the orbit tangent.
    const tx=-Math.sin(d.angle)*d.dir, ty=Math.cos(d.angle)*d.dir;
    d.vx=tx*CONFIG.FLY_SPEED; d.vy=ty*CONFIG.FLY_SPEED;
    d.mode="fly"; d.minDist=1e9;
    Audio2.release(); Haptics.tap();
  },

  /* dot captured by `next` ring; perp = straight-line closest-approach
     distance to the ring's center → hit quality + near-miss feedback. */
  capture(perp){
    const ring=this.next;
    // same threshold expression as classifyShot() — keep them identical
    const perfect=perp<=ring.r*ring.pf;
    this.rings++;
    let points;
    if(perfect){
      this.combo=Math.min(this.combo+1,CONFIG.COMBO_MAX);
      this.peakCombo=Math.max(this.peakCombo,this.combo);
      this.perfectRow++; this.runPerfects++;
      points=this.combo;
      Audio2.perfect(this.combo); Haptics.perfect();
      Particles.perfectFX(ring.x,ring.y,ring.r,UI.trailColor());
      Juice.perfect(ring,this.combo);
      this.fx.shake=Math.max(this.fx.shake,0.5+this.combo*0.06);
      this.float(ring.x,ring.y+ring.r+30,tr("perfect",{n:this.combo}),UI.trailColor(),20);
    }else{
      // soft break: lose a couple of steps, not the whole streak
      this.combo=Math.max(1,this.combo-CONFIG.COMBO_BREAK_STEP); this.perfectRow=0; points=1;
      Juice.hit(ring);
      Audio2.thunk(); Haptics.hit();
      Particles.burst(this.dot.x,this.dot.y,"#ffffff",10,140);
      this.fx.shake=Math.max(this.fx.shake,0.25);
      const edgePx=Math.round(ring.r-perp);
      this.float(ring.x,ring.y+ring.r+30,edgePx<8?tr("clipped"):this.combo>1?tr("combo_kept",{n:this.combo}):`+1`,"#ffffff",16);
    }
    this.score+=points;
    this.fx.scorePop=1;
    // live NEW BEST the moment you pass it (not just on the death screen)
    if(!this.beatBestThisRun&&S.best>=5&&this.score>S.best){ this.beatBestThisRun=true; Juice.newBest(ring); }
    // live XP so level-ups can pop mid-run
    this.runXPGained+=Progress.gainXP(points*CONFIG.XP_PER_POINT);
    Missions.progress({ring:true,score:this.score,perfectRow:this.perfectRow});
    this.checkScoreMilestone();

    // promote rings
    ring.pulse=1;
    this.prevRing=this.cur; this.prevRingFade=1;
    this.cur=ring;
    this.spawnNext();

    // dot latches on: orbit from its capture position, radius eases out
    const d=this.dot;
    d.mode="orbit";
    d.angle=Math.atan2(d.y-ring.y,d.x-ring.x);
    d.orbR=Math.max(Math.hypot(d.x-ring.x,d.y-ring.y),ring.r*0.3);
    d.orbRT=ring.r+CONFIG.ORBIT_GAP;
    d.omega=this.orbitSpeed(this.rings);
    // random rotation flip — the trap that keeps veterans honest
    if(Math.random()<this.flipChance(this.rings)){
      d.dir*=-1; this.flipsSeen++;
      this.float(ring.x,ring.y,(d.dir>0?"⟳ ":"⟲ ")+tr("flip"),"#ffc94d",17);
      Audio2.blip(500,300,0.12,"square",0.2);
    }
  },

  /* score milestones: 5,10,25,50,75,100 then every 50 — always a visible
     next target, procedurally infinite. */
  nextMilestone(s){
    const seq=[5,10,25,50,75,100];
    for(const m of seq) if(s<m) return m;
    return (Math.floor(s/50)+1)*50;
  },
  checkScoreMilestone(){
    const before=this.nextMilestone(this.score-1), after=this.nextMilestone(this.score);
    if(after!==before){ // crossed `before`
      this.float(this.cur.x,this.cur.y+this.cur.r+58,`— ${before} —`,"#ffd23f",24);
      Particles.burst(this.cur.x,this.cur.y,"#ffd23f",16,200);
      Audio2.blip(660,990,0.15,"triangle",0.3);
    }
  },

  /* one free save per run: the current ring "reels the dot back in"
     instead of ending the run. Combo drops like a plain landing. */
  freeSave(margin){
    this.savesLeft--;
    const d=this.dot, c=this.cur;
    d.mode="orbit";
    d.angle=Math.atan2(d.y-c.y,d.x-c.x);
    d.orbR=Math.min(Math.hypot(d.x-c.x,d.y-c.y),260);   // eases back onto the orbit
    d.minDist=1e9; d.trail.length=0;
    this.combo=Math.max(1,this.combo-CONFIG.COMBO_BREAK_STEP); this.perfectRow=0;
    Juice.saved(c,margin);
  },

  die(margin){
    this.state="dying"; this.dyingT=0;
    this.missMargin=margin;
    Audio2.miss(); Haptics.death();
    this.fx.shake=1;
    Particles.burst(this.dot.x,this.dot.y,"#ff5e8a",22,240);
    Juice.death(margin);
    Music.dip();
  },
  /* price of the NEXT coin revive this run — escalates so it can't be
     spammed; resets every run. */
  nextRevivePrice(){
    return Math.round(CONFIG.REVIVE_COIN_BASE*Math.pow(CONFIG.REVIVE_COIN_GROWTH,this.coinRevives));
  },
  /* coin-revive path: same continue as the rewarded ad, paid in coins.
     Resolves the revive gate → a pending interstitial is cancelled. */
  coinRevive(){
    if(this.state!=="over") return;
    const price=this.nextRevivePrice();
    if(S.coins<price) return;
    S.coins-=price; this.coinRevives++; save();
    Ads.interstitialPending=false;      // revive taken — interstitial loses
    UI.toast(tr("coin_revive",{n:price}),true);
    Audio2.unlock(); Haptics.perfect();
    this.revive();
  },
  /* revive core (rewarded ad or coins): back in orbit around the launch
     ring, score kept. `revived` flags only the once-per-run AD continue. */
  revive(fromAd){
    if(fromAd) this.revived=true;
    const d=this.dot, ring=this.cur;
    d.mode="orbit";
    d.angle=rand(0,TAU); d.orbR=d.orbRT=ring.r+CONFIG.ORBIT_GAP;
    d.minDist=1e9; d.trail.length=0;
    this.state="playing";
    UI.showScreen(null);
    $("btn-pause").style.display="block";
    Awake.on();
    Music.play("game");
  },

  float(x,y,txt,color,size){
    for(const f of this.floats){
      if(!f.on){f.on=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.size=size;f.life=f.maxLife=1.1;return;}
    }
  },

  /* ── main loop ──────────────────────────────────────────────────── */
  frame(t){
    requestAnimationFrame(tt=>this.frame(tt));
    let dt=(t-this.lastT)/1000; this.lastT=t;
    if(dt>0.1) dt=0.1;                     // tab-switch spike guard
    if(this.state==="paused") return;      // loop halted while paused
    // hit-stop: freeze the sim for a few frames on big hits (impact read)
    if(this.fx.hitstop>0){ this.fx.hitstop-=dt; this.render(); return; }
    this.time+=dt;
    this.update(dt);
    this.render();
  },

  update(dt){
    const playing=this.state==="playing"||this.state==="dying";
    Particles.update(dt);
    if(this.fx.shake>0) this.fx.shake=Math.max(0,this.fx.shake-dt*2.4);
    if(this.fx.chroma>0) this.fx.chroma=Math.max(0,this.fx.chroma-dt*1.6);
    Juice.update(dt);
    for(const f of this.floats){ if(f.on){ f.life-=dt; f.y-=26*dt; if(f.life<=0) f.on=false; } }
    if(this.prevRing&&this.prevRingFade>0) this.prevRingFade=Math.max(0,this.prevRingFade-dt*1.4);
    if(!playing){
      // menu: idle world drift so the background feels alive
      this.camY-=dt*6;
      return;
    }

    const d=this.dot;
    // moving targets oscillate horizontally (smooth, clamped amplitude)
    for(const ring of [this.cur,this.next]){
      if(ring&&ring.moveAmp>0) ring.x=ring.baseX+Math.sin(this.time*ring.moveSpeed+ring.movePhase)*ring.moveAmp;
      if(ring&&ring.pulse>0) ring.pulse=Math.max(0,ring.pulse-dt*2.5);
    }

    if(this.state==="dying"){
      const sdt=dt*0.35;                   // slow-mo death for readability
      d.x+=d.vx*sdt; d.y+=d.vy*sdt;
      this.dyingT+=dt;
      const slow=this.missMargin!==null&&this.missMargin<=CONFIG.NEAR_MISS_SHOW_PX?CONFIG.NEAR_MISS_SLOWMO_S:CONFIG.DEATH_SLOWMO_S;
      if(this.dyingT>=slow) UI.gameOver();
      return;
    }

    if(d.mode==="orbit"){
      d.orbR=lerp(d.orbR,d.orbRT,1-Math.exp(-dt*10)); // ease onto orbit radius
      d.angle+=d.dir*d.omega*dt;
      d.x=this.cur.x+Math.cos(d.angle)*d.orbR;
      d.y=this.cur.y+Math.sin(d.angle)*d.orbR;
    }else{ // fly
      const px=d.x,py=d.y;
      d.x+=d.vx*dt; d.y+=d.vy*dt;
      const ring=this.next;
      // segment-based checks → no tunneling even on a lagging frame.
      // Capture on the SEGMENT distance (not just the endpoint), so a
      // razor-edge clip can't step across the ring in one frame — this
      // is what makes classifyShot()'s prediction exact for static
      // rings at any frame rate.
      const distNow=Math.hypot(d.x-ring.x,d.y-ring.y);
      const segd=segPointDist(px,py,d.x,d.y,ring.x,ring.y);
      d.minDist=Math.min(d.minDist,segd);
      if(segd<=ring.r){
        // perpendicular (closest-approach) distance of the flight line —
        // the "how centered was that" metric, via the SAME shotPerp()
        // the traffic-light predictor uses (see classifyShot)
        const vlen=Math.hypot(d.vx,d.vy);
        const {perp}=shotPerp(d.x,d.y,d.vx/vlen,d.vy/vlen,ring);
        this.capture(Math.min(perp,d.minDist));
      }else{
        const movingAway=((ring.x-d.x)*d.vx+(ring.y-d.y)*d.vy)<0;
        const off=d.x<-40||d.x>this.vw+40||d.y-this.camY>this.vh+80||d.y-this.camY<-120;
        if((movingAway&&distNow>ring.r+10)||off){
          const margin=Math.max(0,d.minDist-ring.r);
          if(this.savesLeft>0) this.freeSave(margin); else this.die(margin);
        }
      }
      // trail: short ring buffer of previous positions
      d.trail.push(d.x,d.y);
      if(d.trail.length>26) d.trail.splice(0,2);
    }

    // camera eases so current ring rests ~62% down the screen
    const targetCam=this.cur.y-this.vh*0.62;
    this.camY=lerp(this.camY,targetCam,1-Math.exp(-dt*4));
  },
};
/* ── SHOT CLASSIFIER — single source of truth ─────────────────────────
   Used BOTH by the in-flight capture code and the traffic-light
   predictor, so the light can never disagree with the score.
   perp = closest-approach distance of the flight ray to the ring
   center. It is invariant along a straight flight, so for a stationary
   ring the release-time prediction IS the capture-time outcome.
   (Once targets start drifting at n≥MOVE_START_N the light reads the
   ring's current position — the same position a release now would be
   scored against.) */
function shotPerp(px,py,tx,ty,ring){
  return {
    ahead:(ring.x-px)*tx+(ring.y-py)*ty>0,          // ring in front of travel?
    perp:Math.abs((ring.x-px)*ty-(ring.y-py)*tx),   // |cross(T, C−P)|, T unit
  };
}
function classifyShot(px,py,tx,ty,ring){
  const s=shotPerp(px,py,tx,ty,ring);
  if(!s.ahead||s.perp>ring.r) return "miss";
  return s.perp<=ring.r*ring.pf?"perfect":"hit";
}
/* point-to-segment distance (capture & near-miss math) */
function segPointDist(ax,ay,bx,by,cx,cy){
  const dx=bx-ax,dy=by-ay;
  const L2=dx*dx+dy*dy;
  if(L2===0) return Math.hypot(cx-ax,cy-ay);
  let t=((cx-ax)*dx+(cy-ay)*dy)/L2;
  t=clamp(t,0,1);
  return Math.hypot(cx-(ax+dx*t),cy-(ay+dy*t));
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   RENDER — one canvas pass per frame. All drawing in virtual units via a
   single setTransform; minimal state changes, zero per-frame allocation.
   ═══════════════════════════════════════════════════════════════════════ */
Game.render=function(){
  const ctx=this.ctx, vw=this.vw, vh=this.vh;
  const k=this.scale*this.dpr;

  // screen shake (skipped in low-FX mode)
  let shx=0,shy=0;
  if(this.fx.shake>0&&!this.lowFX()){
    const s=this.fx.shake*CONFIG.SHAKE_MAX;
    shx=rand(-s,s); shy=rand(-s,s);
  }
  // zoom punch toward the orbit point (where the action is) on hits
  const z=1+this.fx.punch*CONFIG.JUICE_PUNCH_ZOOM, zx=vw/2, zy=vh*0.62;
  ctx.setTransform(k*z,0,0,k*z,(shx+zx*(1-z))*k,(shy+zy*(1-z))*k);

  // background gradient from the equipped "world"
  const bg=bgItem(S.equip.bg);
  const g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,bg.top); g.addColorStop(1,bg.bot);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,vw+40,vh+40);

  // parallax starfield
  ctx.fillStyle="#ffffff";
  for(let i=0;i<this.stars.length;i++){
    const st=this.stars[i];
    let sy=(st.y-this.camY*st.p)%(vh*1.5); if(sy<0)sy+=vh*1.5;
    ctx.globalAlpha=st.a*0.75;
    ctx.beginPath(); ctx.arc(st.x,sy-vh*0.25,st.s*1.3,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  const cam=this.camY;
  const trailC=UI.trailColor();

  // fading previous ring
  if(this.prevRing&&this.prevRingFade>0){
    ctx.globalAlpha=this.prevRingFade*0.35;
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(this.prevRing.x,this.prevRing.y-cam,this.prevRing.r,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  const inRun=this.state==="playing"||this.state==="dying";
  if(inRun){
    // current ring (the one we orbit)
    const c=this.cur;
    ctx.strokeStyle="rgba(36,16,122,.38)"; ctx.lineWidth=7+c.pulse*5;   // candy drop shadow
    ctx.beginPath(); ctx.arc(c.x,c.y-cam+5,c.r+c.pulse*8,0,TAU); ctx.stroke();
    ctx.strokeStyle=trailC; ctx.lineWidth=7+c.pulse*5;
    ctx.beginPath(); ctx.arc(c.x,c.y-cam,c.r+c.pulse*8,0,TAU); ctx.stroke();
    // faint orbit path
    ctx.globalAlpha=0.35; ctx.lineWidth=2; ctx.strokeStyle="#ffffff";
    ctx.beginPath(); ctx.arc(c.x,c.y-cam,this.dot.orbRT,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;

    // target ring: outer + dashed inner "perfect zone" that breathes
    const n=this.next;
    const breathe=1+Math.sin(this.time*3)*0.04;
    // traffic-light assist: edge glow on the NEXT ring only, colored by
    // classifyShot() — the exact function the score uses — so green
    // means "release now = guaranteed PERFECT". Fixed semantic colors
    // (not the equipped scheme), drawn as a glow outside the neutral
    // white ring so it reads on every backdrop without repainting it.
    if(CONFIG.TRAFFIC_LIGHT_ASSIST&&this.state==="playing"&&this.dot.mode==="orbit"){
      const res=this.predictRelease();
      const tint=res==="perfect"?"#3dfc8a":res==="hit"?"#ffd54d":"#ff5e4d";
      // dark underlay + solid colour band: reads on every bright world
      ctx.strokeStyle="rgba(36,16,122,.45)"; ctx.lineWidth=13;
      ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r+9,0,TAU); ctx.stroke();
      ctx.strokeStyle=tint; ctx.lineWidth=7;
      ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r+9,0,TAU); ctx.stroke();
    }
    ctx.fillStyle="rgba(36,16,122,.38)";                            // drop shadow
    ctx.beginPath(); ctx.arc(n.x,n.y-cam+6,n.r+3,0,TAU); ctx.fill();
    ctx.globalAlpha=0.28; ctx.fillStyle="#ffffff";
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r,0,TAU); ctx.stroke();
    // perfect zone: solid bullseye in the trail colour
    ctx.fillStyle=trailC; ctx.globalAlpha=0.95;
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r*n.pf*breathe,0,TAU); ctx.fill();
    ctx.globalAlpha=1;

    // dot trail (while flying) — cheap fading polyline
    const d=this.dot;
    if(d.mode==="fly"&&d.trail.length>=4&&!this.lowFX()){
      ctx.strokeStyle=trailC; ctx.lineCap="round";
      for(let i=0;i<d.trail.length-2;i+=2){
        const a=i/d.trail.length;
        ctx.globalAlpha=a*0.6; ctx.lineWidth=1+a*5;
        ctx.beginPath();
        ctx.moveTo(d.trail[i],d.trail[i+1]-cam);
        ctx.lineTo(d.trail[i+2],d.trail[i+3]-cam);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // aim hint while orbiting: tangent line showing launch direction.
    // Long at level 1 for onboarding, shrinks smoothly with level to a
    // floor (INDICATOR_LEN_BASE/MIN — independent of TARGET_R_MIN).
    if(d.mode==="orbit"){
      const len=clamp(CONFIG.INDICATOR_LEN_BASE-CONFIG.INDICATOR_SHRINK*Math.sqrt(Math.max(S.level-1,0)),
        CONFIG.INDICATOR_LEN_MIN,CONFIG.INDICATOR_LEN_BASE);
      const tx=-Math.sin(d.angle)*d.dir, ty=Math.cos(d.angle)*d.dir;
      // high-contrast aim line: dark outline under a solid white stroke,
      // with a round tip so the launch direction reads at a glance
      const x0=d.x+tx*14, y0=d.y-cam+ty*14, x1=d.x+tx*(14+len), y1=d.y-cam+ty*(14+len);
      ctx.lineCap="round";
      ctx.strokeStyle="rgba(36,16,122,.5)"; ctx.lineWidth=7;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.strokeStyle="#ffffff"; ctx.lineWidth=3.5;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
      ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(x1,y1,4,0,TAU); ctx.fill();
    }

    this.drawDot(ctx,d.x,d.y-cam,cam);
  }

  Particles.draw(ctx,cam);

  // floating texts (world-anchored)
  ctx.textAlign="center";
  for(const f of this.floats){
    if(!f.on) continue;
    ctx.globalAlpha=Math.min(1,f.life/f.maxLife*1.6);
    ctx.font=`900 ${f.size}px system-ui,sans-serif`;
    ctx.lineWidth=5; ctx.lineJoin="round"; ctx.strokeStyle="rgba(36,16,122,.8)";
    ctx.strokeText(f.txt,f.x,f.y-cam);
    ctx.fillStyle=f.color;
    ctx.fillText(f.txt,f.x,f.y-cam);
  }
  ctx.globalAlpha=1;

  // chromatic pulse on level-up: expanding RGB-split rings from center
  if(this.fx.chroma>0&&!this.lowFX()){
    const p=1-this.fx.chroma;
    const r=p*vh*0.8+40;
    ctx.globalAlpha=this.fx.chroma*0.7; ctx.lineWidth=10*this.fx.chroma+2;
    ctx.strokeStyle="#ff004c"; ctx.beginPath(); ctx.arc(vw/2-4,vh/2,r,0,TAU); ctx.stroke();
    ctx.strokeStyle="#00e5ff"; ctx.beginPath(); ctx.arc(vw/2+4,vh/2,r*1.02,0,TAU); ctx.stroke();
    ctx.strokeStyle="#ffffff"; ctx.beginPath(); ctx.arc(vw/2,vh/2,r*1.01,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  Juice.drawWorld(ctx,cam);
  // screen-space overlays + HUD are drawn WITHOUT the zoom punch so the
  // HUD never slides off the edges
  ctx.setTransform(k,0,0,k,shx*k,shy*k);
  Juice.drawScreen(ctx,vw,vh,inRun);
  if(inRun) this.drawHUD(ctx);
};

/* equipped skin renderer — shapes are procedural, no image assets */
Game.drawDot=function(ctx,x,y,cam){
  const skin=skinItem(S.equip.skin);
  const r=CONFIG.DOT_R;
  ctx.fillStyle="rgba(36,16,122,.38)"; ctx.beginPath(); ctx.arc(x,y+4,r+2,0,TAU); ctx.fill();
  ctx.fillStyle=skin.c; ctx.strokeStyle=skin.c;
  switch(skin.shape){
    case "ring": ctx.lineWidth=3.5; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); break;
    case "square": ctx.save(); ctx.translate(x,y); ctx.rotate(this.time*2); ctx.fillRect(-r,-r,r*2,r*2); ctx.restore(); break;
    case "diamond": ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4+this.time); ctx.fillRect(-r*0.9,-r*0.9,r*1.8,r*1.8); ctx.restore(); break;
    case "comet": ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.globalAlpha=0.4; ctx.beginPath(); ctx.arc(x,y,r*1.9,0,TAU); ctx.fill(); ctx.globalAlpha=1; break;
    case "star":{ ctx.save(); ctx.translate(x,y); ctx.rotate(this.time*1.5); ctx.beginPath();
      for(let i=0;i<10;i++){const rr=i%2?r*0.5:r*1.3, a=i/10*TAU; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
