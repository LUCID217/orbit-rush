      ctx.closePath(); ctx.fill(); ctx.restore(); break; }
    case "eye": ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.fillStyle="#0b0d1a"; ctx.beginPath(); ctx.arc(x,y,r*0.45,0,TAU); ctx.fill(); break;
    case "tri": ctx.save(); ctx.translate(x,y);
      ctx.rotate(this.dot.mode==="fly"?Math.atan2(this.dot.vy,this.dot.vx)+Math.PI/2:this.dot.angle);
      ctx.beginPath(); ctx.moveTo(0,-r*1.3); ctx.lineTo(r,r); ctx.lineTo(-r,r); ctx.closePath(); ctx.fill(); ctx.restore(); break;
    default: ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
};

/* in-run HUD: ghost progress bar, big score, combo, next milestone,
   level chip. All offset by safe-area + banner so nothing is obscured. */
Game.drawHUD=function(ctx){
  const vw=this.vw, top=this.safeTop, bot=this.vh-this.safeBottom;

  // ghost bar: this run vs best (plus last-run marker) — always visible
  const best=Math.max(S.best,1);
  const bw=vw*0.6, bx=(vw-bw)/2, by=top+14;
  ctx.fillStyle="#00000030"; ctx.fillRect(bx,by,bw,6);
  ctx.fillStyle="#ffd23f"; ctx.fillRect(bx,by,bw*clamp(this.score/best,0,1),6);
  if(S.lastRun>0){
    ctx.fillStyle="#ffffff";
    ctx.fillRect(bx+bw*clamp(S.lastRun/best,0,1)-1.5,by-3,3,11);
  }
  ctx.fillStyle="#ffffffcc"; ctx.font="800 10px system-ui,sans-serif";
  ctx.textAlign="left"; ctx.fillText("0",bx-12,by+6);
  ctx.textAlign="right"; ctx.fillText(`${S.best}`,bx+bw+26,by+6);

  // score + combo
  ctx.textAlign="center";
  ctx.font=`900 ${Math.round(46*(1+this.fx.scorePop*0.35))}px system-ui,sans-serif`;
  ctx.fillStyle="rgba(36,16,122,.45)"; ctx.fillText(`${this.score}`,vw/2,top+68);   // drop shadow
  ctx.fillStyle="#ffffff"; ctx.fillText(`${this.score}`,vw/2,top+64);
  if(this.combo>1){
    const pulse=1+Math.sin(this.time*8)*0.08;
    ctx.font=`900 ${Math.round(20*pulse)}px system-ui,sans-serif`;
    ctx.lineWidth=5; ctx.lineJoin="round"; ctx.strokeStyle="rgba(36,16,122,.8)";
    const comboTxt=tr("combo",{n:this.combo});   // outline and fill must be the same (translated) text
    ctx.strokeText(comboTxt,vw/2,top+90);
    ctx.fillStyle=UI.trailColor(); ctx.fillText(comboTxt,vw/2,top+90);
  }else{
    ctx.fillStyle="#ffffffd9"; ctx.font="800 12px system-ui,sans-serif";
    ctx.fillText(tr("next",{n:this.nextMilestone(this.score)}),vw/2,top+86);
  }

  // free-save shield chip (top-left) while it's still available
  if(this.savesLeft>0){
    ctx.textAlign="left"; ctx.font="900 15px system-ui,sans-serif";
    ctx.fillStyle="#ffffff"; ctx.fillText(`🛡×${this.savesLeft}`,14,top+30);
  }

  // level chip bottom-left with mini XP bar (clears banner via safeBottom)
  const need=xpForLevel(S.level);
  ctx.textAlign="left"; ctx.fillStyle="#ffffff"; ctx.font="900 13px system-ui,sans-serif";
  ctx.fillText(`${tr("lvl")} ${S.level}`,14,bot-22);
  ctx.fillStyle="#00000030"; ctx.fillRect(14,bot-16,90,5);
  ctx.fillStyle="#ffd23f";  ctx.fillRect(14,bot-16,90*clamp(S.xpInLevel/need,0,1),4);
  if(S.rebirths>0){
    ctx.fillStyle="#a78bfa"; ctx.font="700 11px system-ui,sans-serif";
    ctx.fillText(`🌀×${(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)}`,112,bot-18);
  }
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   JUICE — the "loud" layer: hit-stop, zoom punch, shockwaves, praise
   words, FEVER, live NEW BEST, near-miss drama. Presentation only —
   it reads game state but never changes hits, scores or difficulty,
   so the challenge stays 100% skill-driven.
   ═══════════════════════════════════════════════════════════════════════ */
const Juice={
  init(){
    for(let i=0;i<8;i++) Game.waves.push({on:false,x:0,y:0,r:0,maxR:0,life:0,maxLife:1,color:"#fff",w:4});
  },
  wave(x,y,r0,r1,life,color,w){
    for(const v of Game.waves){
      if(!v.on){ v.on=true;v.x=x;v.y=y;v.r=r0;v.r0=r0;v.maxR=r1;v.life=v.maxLife=life;v.color=color;v.w=w; return; }
    }
  },
  say(txt,color,size=44){
    const w=Game.word; w.txt=txt; w.color=color; w.size=size; w.age=0;
  },
  fever(){ return Game.combo>=CONFIG.JUICE_FEVER_COMBO; },

  perfect(ring,combo){
    const c=UI.trailColor(), fev=combo>=CONFIG.JUICE_FEVER_COMBO;
    Game.fx.hitstop=CONFIG.JUICE_HITSTOP_S*(fev?1.6:1);
    Game.fx.punch=1;
    if(combo===CONFIG.JUICE_FEVER_COMBO) Game.fx.flash=Math.max(Game.fx.flash,0.7);   // only on entering FEVER
    // shockwaves stay well short of the next target so aiming stays clean
    this.wave(ring.x,ring.y,ring.r,ring.r*2.2,0.4,c,6);
    if(combo>=3) this.wave(ring.x,ring.y,ring.r*0.5,ring.r*2.8,0.5,"#ffffff",3);
    Audio2.boom(combo);
    const W=tr("words"), word=W[Math.min(combo-1,W.length-1)];
    if(word){ this.say(word,fev?"#ffffff":c,38+combo*3); Audio2.stinger(combo); }
    if(combo===CONFIG.JUICE_FEVER_COMBO){
      Game.float(ring.x,ring.y+ring.r+34,tr("fever"),"#ffc94d",22);
      Particles.burst(ring.x,ring.y,"#ffc94d",24,300);
    }
    if(combo>=CONFIG.COMBO_MAX){                       // max combo: everything
      Particles.burst(ring.x,ring.y,"#ffffff",20,320);
      Game.fx.shake=Math.max(Game.fx.shake,1);
    }
    const h=window.Capacitor?.Plugins?.Haptics;
    if(fev&&h) h.impact({style:"HEAVY"}).catch(()=>{});
  },
  hit(ring){
    this.wave(ring.x,ring.y,ring.r,ring.r*1.8,0.3,"#ffffff",3);
    Game.fx.punch=Math.max(Game.fx.punch,0.35);
  },
  newBest(ring){
    this.say(tr("say_new_best"),"#ffc94d",50);
    Audio2.fanfare(); Haptics.perfect();
    for(let i=0;i<3;i++) Particles.perfectFX(ring.x,ring.y,ring.r,UI.trailColor(),{style:"confetti"});
    Game.fx.flash=1;
  },
  saved(ring,margin){
    this.say(tr("saved"),"#3dffb4",48);
    this.wave(ring.x,ring.y,ring.r,ring.r*2.4,0.5,"#3dffb4",7);
    Audio2.blip(330,880,0.25,"triangle",0.35); Audio2.blip(660,1320,0.2,"sine",0.2,0.08);
    Haptics.hit(); Game.fx.shake=Math.max(Game.fx.shake,0.5);
    Game.float(ring.x,ring.y+ring.r+30,tr("free_save"),"#ffffff",16);
  },
  death(margin){
    if(margin!==null&&margin<=CONFIG.NEAR_MISS_SHOW_PX){
      this.say(tr("so_close"),"#ff5e8a",46);
      Audio2.soClose();
      Game.float(Game.dot.x,Game.dot.y-24,`${Math.max(1,Math.round(margin))}px!`,"#ff5e8a",22);
    }
  },

  update(dt){
    const f=Game.fx;
    if(f.punch>0) f.punch=Math.max(0,f.punch-dt*5);
    if(f.scorePop>0) f.scorePop=Math.max(0,f.scorePop-dt*5);
    if(f.flash>0) f.flash=Math.max(0,f.flash-dt*3);
    Game.word.age+=dt;
    for(const v of Game.waves){
      if(!v.on) continue;
      v.life-=dt; if(v.life<=0){ v.on=false; continue; }
      const p=1-v.life/v.maxLife;
      v.r=v.r0+(v.maxR-v.r0)*(1-Math.pow(1-p,3));
    }
  },

  drawWorld(ctx,cam){
    // shockwave rings
    for(const v of Game.waves){
      if(!v.on) continue;
      const a=v.life/v.maxLife;
      ctx.globalAlpha=a*0.8; ctx.strokeStyle=v.color; ctx.lineWidth=v.w*a+1;
      ctx.beginPath(); ctx.arc(v.x,v.y-cam,v.r,0,TAU); ctx.stroke();
    }
    ctx.globalAlpha=1;
  },
  drawScreen(ctx,vw,vh,inRun){
    const low=Game.lowFX();
    // FEVER: pulsing edge glow in the trail colour while the combo is hot
    if(inRun&&this.fever()&&!low){
      const pulse=0.07+0.04*Math.sin(Game.time*10);
      const g=ctx.createRadialGradient(vw/2,vh/2,vh*0.3,vw/2,vh/2,vh*0.75);
      g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,UI.trailColor());
      ctx.globalAlpha=pulse; ctx.fillStyle=g; ctx.fillRect(-20,-20,vw+40,vh+40);
      ctx.globalAlpha=1;
    }
    // full-screen flash on PERFECT / NEW BEST
    if(Game.fx.flash>0&&!low){
      ctx.globalAlpha=Game.fx.flash*0.10; ctx.fillStyle="#ffffff";
      ctx.fillRect(-20,-20,vw+40,vh+40); ctx.globalAlpha=1;
    }
    // praise word: overshoot pop-in, hold, float up and fade
    const w=Game.word;
    if(w.age<1.1&&w.txt){
      const pop=w.age<0.12?w.age/0.12*1.35:w.age<0.22?1.35-(w.age-0.12)/0.1*0.35:1;
      const a=w.age>0.8?1-(w.age-0.8)/0.3:1;
      ctx.save();
      // below the orbit ring: never covers the ring you're aiming at
      ctx.translate(vw/2,vh*0.82-w.age*18);
      ctx.font=`900 ${w.size}px system-ui,sans-serif`;
      const fit=Math.min(1,vw*0.86/ctx.measureText(w.txt).width);
      ctx.scale(pop*fit,pop*fit);
      ctx.globalAlpha=clamp(a,0,1);
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font=`900 ${w.size}px system-ui,sans-serif`;
      ctx.lineWidth=8; ctx.lineJoin="round"; ctx.strokeStyle="rgba(36,16,122,.9)"; ctx.strokeText(w.txt,0,0);
      ctx.fillStyle=w.color; ctx.fillText(w.txt,0,0);
      ctx.restore();
      ctx.textBaseline="alphabetic";
    }
  },
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UI — DOM screens, toasts, unlock browser, and screen flow.
   ═══════════════════════════════════════════════════════════════════════ */
const UI={
  curTab:"trail",
  pendingBuy:null, pendingBuyT:0,    // two-tap purchase state
  rebirthArmed:false, rebirthT:0,    // two-tap rebirth state
  trailColor(){ return trailItem(S.equip.trail).c; },

  init(){
    $("btn-play").addEventListener("click",()=>{ Audio2.ensure(); Audio2.ui(); Game.startRun(); });
    // Leaving the over screen = revive declined → a pending interstitial
    // (3rd-death cadence) may fire now, never earlier.
    $("btn-retry").addEventListener("click",()=>{ Ads.reviveDeclined(); Audio2.ui(); Game.startRun(); });
    $("btn-home").addEventListener("click",()=>{ Ads.reviveDeclined(); Audio2.ui(); this.home(); });
    // one-tap retry: any tap on the over screen that isn't a button.
    // A short guard stops the tap that caused the death from skipping it.
    $("over").addEventListener("click",e=>{
      if(e.target.closest("button")) return;
      if(performance.now()-(this.overShownAt||0)<450) return;
      Ads.reviveDeclined(); Audio2.ui(); Game.startRun();
    });
    $("btn-pause").addEventListener("click",()=>this.pause());
    $("btn-resume").addEventListener("click",()=>this.resume());
    $("btn-p-restart").addEventListener("click",()=>{ Audio2.ui(); Game.startRun(); });
    $("btn-p-home").addEventListener("click",()=>{ Audio2.ui(); this.home(); });
    $("btn-sound").addEventListener("click",()=>{
      S.muted=!S.muted; save(); this.refreshHome();
      if(S.muted){ Music.stop(); Audio2.suspend(); } else { Audio2.ensure(); Audio2.ui(); Music.play(Music.want); }
    });
    $("btn-music").addEventListener("click",()=>{
      S.musicOn=!S.musicOn; save(); this.refreshHome(); Audio2.ui();
      if(S.musicOn) Music.play(Music.want); else Music.stop();
    });
    // Mobile autoplay rules: audio may only start inside a user gesture.
    // On phones a touch only counts as "activation" on touchend /
    // pointerup / click — NOT on pointerdown (that's why the menu track
    // used to stay silent until a button was pressed). So listen to all
    // of them; the first real one wakes the context and starts the track,
    // and any tap after the app was backgrounded wakes it again.
    const wake=()=>{
      if(!Music.enabled()) return;
      Audio2.ensure();
      Audio2.unlockIOS();
      if(!Music.song) Music.play(Game.state==="playing"||Game.state==="dying"?"game":"menu");
    };
    for(const ev of ["pointerdown","pointerup","touchend","click","keydown"])
      document.addEventListener(ev,wake,{capture:true,passive:true});
    $("btn-fx").addEventListener("click",()=>{
      S.lowFX=!S.lowFX; save(); Game.resize(); this.refreshHome(); Audio2.ui();
    });
    // Two-tap confirm — native confirm() dialogs are silently blocked in
    // sandboxed WebViews/previews, so no blocking dialogs anywhere.
    $("btn-rebirth").addEventListener("click",()=>{
      if(this.rebirthArmed){
        clearTimeout(this.rebirthT); this.rebirthArmed=false;
        Progress.rebirth(); return;
      }
      const mult=(1+(S.rebirths+1)*CONFIG.REBIRTH_MULT_GAIN).toFixed(1);
      this.rebirthArmed=true; Audio2.ui();
      $("btn-rebirth").textContent=tr("rebirth_confirm",{m:mult});
      this.rebirthT=setTimeout(()=>{ this.rebirthArmed=false; this.refreshHome(); },3500);
    });
    $("btn-unlocks").addEventListener("click",()=>{ Audio2.ui(); this.showScreen("unlocks"); this.renderUnlocks(); });
    $("btn-u-back").addEventListener("click",()=>{ Audio2.ui(); this.home(); });
    document.querySelectorAll("#unlocks .tabs button").forEach(b=>{
      b.addEventListener("click",()=>{
        this.curTab=b.dataset.tab; Audio2.ui();
        document.querySelectorAll("#unlocks .tabs button").forEach(x=>x.classList.toggle("on",x===b));
        this.renderUnlocks();
      });
    });
    $("btn-doublexp").addEventListener("click",()=>Ads.rewardDoubleXP());
    $("btn-continue").addEventListener("click",()=>Ads.rewardContinue());
    $("btn-coinrevive").addEventListener("click",()=>Game.coinRevive());
    $("btn-privacy").addEventListener("click",()=>Ads.showPrivacyOptions());
    $("btn-lang").addEventListener("click",()=>{ Audio2.ui(); Lang.next(); });
    // Web build (Netlify / desktop browser): ads and Play Billing can't
    // run, so hide their entry points instead of showing dead buttons.
    // Coin revive stays — it works everywhere.
    if(!Ads.plugin()){
      for(const id of ["btn-continue","btn-doublexp","btn-privacy"]) $(id).classList.add("hidden");
    }
    if(!Billing.plugin()) document.querySelector('#unlocks .tabs button[data-tab="coins"]').classList.add("hidden");
    this.applyScheme();
    this.applyLang();
  },
  /* fill every [data-i18n] element, then redraw the dynamic text */
  applyLang(){
    document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=tr(el.dataset.i18n); });
    Crew.text();
    this.refreshHome();
    if(!$("unlocks").classList.contains("hidden")) this.renderUnlocks();
  },

  showScreen(name){ // null = none (in game)
    for(const id of ["start","over","pause","unlocks"])
      $(id).classList.toggle("hidden",id!==name);
    if(name!=="over") Crew.close(false);   // a new run / home quietly closes the email card
    if(name!==null) $("btn-pause").style.display="none";
  },
  home(){
    Game.state="menu"; Awake.off();
    Music.play("menu");
    this.refreshHome(); this.showScreen("start");
  },
  refreshHome(){
    $("s-best").textContent=S.best;
    $("s-coins").textContent=S.coins;
    $("shop-dot").classList.toggle("hidden",!this.shopHasNew());
    $("s-streak").textContent=S.streak;
    $("s-rebirth").textContent=S.rebirths>0?tr("rebirth_mult",{m:(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)}):tr("xp_mult",{m:xpMult().toFixed(1)});
    $("s-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("s-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("s-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
    $("btn-sound").textContent=S.muted?"🔇":"🔊";
    $("btn-music").textContent=tr(S.musicOn?"music_on":"music_off");
    $("btn-music").style.opacity=S.muted?".45":"";
    $("btn-fx").textContent=tr(S.lowFX?"fx_lo":"fx_hi");
    $("btn-lang").textContent="🌐 "+Lang.NAMES[Lang.cur];
    $("btn-rebirth").classList.toggle("hidden",!Progress.rebirthAvailable());
    if(!this.rebirthArmed) $("btn-rebirth").textContent=tr("rebirth_btn");
    this.renderMissions();
  },
  renderMissions(id="s-missions",showGain=false){
    const el=$(id); el.innerHTML="";
    for(const m of S.missions){
      const div=document.createElement("div");
      div.className="mission"+(m.p>=m.n?" done":"");
      const was=Missions.before?.get(Missions.key(m));
      const gain=showGain&&was!==undefined&&m.p>was?`<span class="up">▲${m.p-was}</span>`:"";
      div.innerHTML=`<span>🎯 ${Missions.text(m)}</span><span class="mprog">${Math.min(m.p,m.n)}/${m.n}${gain} · +${m.xp}xp</span>`;
      el.appendChild(div);
    }
  },

  pause(){
    if(Game.state!=="playing") return;
    Game.state="paused";
    Audio2.suspend(); Awake.off();
    this.showScreen("pause");
  },
  resume(){
    if(Game.state!=="paused") return;
    this.showScreen(null);
    $("btn-pause").style.display="block";
    Audio2.ensure(); Awake.on();
    Game.state="playing";
  },

  gameOver(){
    Game.state="over";
    Awake.off();
    const score=Game.score;
    const wasBest=score>S.best, prevBest=S.best;
    // near-miss feedback: the "one more run" hook
    const m=Game.missMargin;
    $("o-miss").textContent = m!==null ? tr("missed_by",{n:Math.max(1,Math.round(m))}) : "";
    // headline = the "so close, again!" hook, shown first and biggest
    const gap=S.best-score, head=$("o-head");
    head.classList.remove("calm");
    if(wasBest&&S.best>0)                   head.textContent=tr("head_new_best");
    else if(wasBest)                        head.textContent=tr("head_first");
    else if(gap===0)                        head.textContent=tr("head_tied");
    else if(gap<=Math.max(3,Math.ceil(S.best*0.25))) head.textContent=tr("head_only",{n:gap});
    else if(m!==null&&m<=CONFIG.NEAR_MISS_SHOW_PX)    head.textContent=tr("so_close");
    else { head.textContent=tr("head_calm",{n:S.best}); head.classList.add("calm"); }
    // ghost bar: this run vs best, marker = previous run
    const ref=Math.max(S.best,score,1);
    $("o-you").style.width=`${clamp(score/ref*100,0,100)}%`;
    $("o-mark").style.left=`${clamp(S.lastRun/ref*100,0,100)}%`;
    $("o-bestn").textContent=Math.max(S.best,score);
    if(wasBest){ S.best=score; Audio2.unlock(); }
    this.countUp($("o-score"),score);
    $("o-xp").textContent=`+${Game.runXPGained} XP`;
    // coin payout: score-scaled + a bonus per PERFECT landed
    const coinsEarned=Math.round(score*CONFIG.COINS_PER_SCORE)+Game.runPerfects*CONFIG.COINS_COMBO_BONUS;
    S.coins+=coinsEarned;
    $("o-coins").textContent=`+${coinsEarned} 🪙 (${S.coins})`;
    $("o-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("o-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("o-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
    // revive paths (both resolve BEFORE any pending interstitial):
    // ad continue once per run; coin continue at an escalating price
    // offers you can't take are hidden, not greyed out — less clutter
    if(Ads.plugin()) $("btn-continue").classList.toggle("hidden",Game.revived||!Ads.rewardedReady());
    const revPrice=Game.nextRevivePrice();
    $("o-revcost").textContent=revPrice;
    $("btn-coinrevive").classList.toggle("hidden",S.coins<revPrice);
    $("btn-doublexp").disabled=Game.runXPGained<=0||!Ads.rewardedReady();
    S.lastRun=score;
    S.runsPlayed++; S.deaths++;
    Missions.progress({run:true,score});
    this.renderMissions("o-missions",true);
    save();
    this.showScreen("over");
    this.overShownAt=performance.now();
    Music.play("game");        // keep the energy up — next run is one tap away
    Ads.onGameOver();       // marks interstitial pending; fires only after revive is resolved
    Crew.maybeOffer(wasBest&&prevBest>=5, Game.peakCombo>=CONFIG.COMBO_MAX);
  },

  /* re-sync the game-over screen's level/XP bar (after rewarded 2× XP) */
  gameOverXPRefresh(){
    $("o-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("o-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("o-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
  },

  /* game-over score ticks up instead of appearing — reads as a payout */
  countUp(el,to){
    const t0=performance.now(), dur=Math.min(900,250+to*25);
    const step=now=>{
      const p=clamp((now-t0)/dur,0,1), v=Math.round(to*(1-Math.pow(1-p,3)));
      el.textContent=v;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },

  toast(txt,big=false){
    const box=$("toasts");   // cap the stack: a burst of unlocks/level-ups
    while(box.children.length>=4) box.firstChild.remove();
    const div=document.createElement("div");
    div.className="toast"+(big?" big":"");
    div.textContent=txt;
    $("toasts").appendChild(div);
    setTimeout(()=>div.remove(),3200);
  },
  levelFx(lvl){
    const el=$("lvlfx");
    $("lvlfx-num").textContent=lvl;
    el.classList.remove("on");
    void el.offsetWidth;      // restart CSS animation
    el.classList.add("on");
    setTimeout(()=>el.classList.remove("on"),1200);
  },

  /* ── SHOP ──────────────────────────────────────────────────────────
     Hybrid model (chosen for continuity with the existing XP curve):
     lifetime XP unlocks a TIER's availability (unlockCost — the same
     endless thresholds as before), coins BUY the item (coinPrice).
     Item states: XP-locked → buyable (+NEW badge) → owned → equipped. */
  renderUnlocks(){
    $("u-xp").textContent=S.lifetimeXP;
    $("u-coins").textContent=S.coins;
    const grid=$("u-grid"); grid.innerHTML="";
    const cat=this.curTab;
    if(cat==="coins"){ this.renderCoinsTab(grid); return; }
    grid.style.gridTemplateColumns="";   // restore 4-col grid after coins tab
    const avail=unlockedCount();        // XP-availability (shared tier curve)
    const seen=S.shopSeen[cat];
    for(let i=0;i<avail+4;i++){         // tease the next 4 XP-locked tiers
      const cell=document.createElement("button");
      cell.className="cell";
      const item=CAT_ITEM[cat](i);
      // cell IS the preview: swatch / gradient / glyph in the item's style
      if(cat==="trail")      cell.style.background=item.c;
      else if(cat==="skin"){ cell.style.background="#3a1f9e"; cell.style.color=item.c; cell.textContent=item.shape; }
      else if(cat==="bg")    cell.style.background=`linear-gradient(${item.top},${item.bot})`;
      else if(cat==="sound"){cell.style.background="#3a1f9e"; cell.style.fontSize="22px"; cell.textContent="♪"; }
      else{                  cell.style.background="#3a1f9e"; cell.style.fontSize="20px"; cell.textContent="✹"; }
      cell.title=item.name;
      const owned=S.owned[cat].includes(i);
      if(i>=avail){                     // XP-locked: needs more lifetime XP
        cell.classList.add("lock");
        cell.innerHTML+=`<div class="cost">⭐${unlockCost(i)}xp</div>`;
        // a dead tap reads as broken — explain the gate instead
        cell.addEventListener("click",()=>{
          Audio2.ui();
          this.toast(tr("locked",{cost:unlockCost(i),xp:S.lifetimeXP}));
        });
      }else if(!owned){                 // available: coins buy it (two-tap)
        const armed=this.pendingBuy&&this.pendingBuy.cat===cat&&this.pendingBuy.i===i;
        if(armed) cell.classList.add("arm");
        cell.innerHTML+=`<div class="cost">${armed?tr("tap_buy_cell"):"🪙"+coinPrice(i)}</div>`;
        if(i>=seen&&!armed) cell.innerHTML+=`<div class="badge">${tr("new_badge")}</div>`;
        cell.addEventListener("click",()=>this.buy(cat,i));
      }else{                            // owned: tap to equip (+preview)
        if(S.equip[cat]===i) cell.classList.add("eq");
        cell.addEventListener("click",()=>{
          S.equip[cat]=i; save(); Haptics.tap();
          if(cat==="sound") Audio2.preview(i); else Audio2.ui();
          if(cat==="trail") this.applyScheme();
          if(cat==="fx")    // live demo burst behind the translucent panel
            Particles.perfectFX(Game.vw/2,Game.camY+Game.vh/2,40,this.trailColor(),fxItem(i));
          this.renderUnlocks();
        });
      }
      grid.appendChild(cell);
    }
    S.shopSeen[cat]=avail; save();      // this tab's tiers are now "seen"
    $("shop-dot").classList.toggle("hidden",!this.shopHasNew());
  },
  /* two-tap purchase (no confirm() — blocked in sandboxed WebViews):
     first tap arms the cell + previews, second tap within 3s buys. */
  buy(cat,i){
    const price=coinPrice(i), item=CAT_ITEM[cat](i);
    if(S.coins<price){
      if(cat==="sound") Audio2.preview(i);
      this.toast(tr("need_more",{n:price-S.coins,name:item.name}));
      return;
    }
    const armed=this.pendingBuy&&this.pendingBuy.cat===cat&&this.pendingBuy.i===i;
    if(!armed){
      clearTimeout(this.pendingBuyT);
      this.pendingBuy={cat,i};
      if(cat==="sound") Audio2.preview(i); else Audio2.ui();
      this.toast(tr("tap_buy",{name:item.name,n:price}));
      this.pendingBuyT=setTimeout(()=>{ this.pendingBuy=null; this.renderUnlocks(); },3000);
      this.renderUnlocks();
      return;
    }
    clearTimeout(this.pendingBuyT); this.pendingBuy=null;
    S.coins-=price; S.owned[cat].push(i); S.equip[cat]=i;
    save(); Audio2.unlock(); Haptics.perfect();
    this.toast(tr("equipped",{name:item.name}),true);
    if(cat==="trail") this.applyScheme();
    this.renderUnlocks();
  },
  /* 🪙+ tab: real-money coin packs + Remove Ads + Restore (Play Billing).
     In a browser these no-op with a toast — see the Billing module. */
  renderCoinsTab(grid){
    grid.style.gridTemplateColumns="1fr";  // full-width rows, not swatches
    CONFIG.IAP_COIN_PACKS.forEach((p,idx)=>{
      const b=document.createElement("button");
      b.className="packrow";
      b.innerHTML=`<span>💰 ${tr("pack_"+["small","medium","large","mega"][Math.min(idx,3)])}</span><b>${p.coins.toLocaleString()} 🪙</b>`;
      b.addEventListener("click",()=>Billing.buyCoinPack(idx));
      grid.appendChild(b);
    });
    const ra=document.createElement("button");
    ra.className="packrow";
    if(S.removeAds){
      ra.disabled=true;
      ra.innerHTML=`<span>${tr("ads_removed")}</span><b>${tr("thanks")}</b>`;
    }else{
      ra.innerHTML=`<span>${tr("remove_ads")}</span><b>${tr("remove_ads_desc")}<br><small>${tr("remove_ads_note")}</small></b>`;
      ra.addEventListener("click",()=>Billing.buyRemoveAds());
    }
    grid.appendChild(ra);
    const rs=document.createElement("button");
    rs.className="packrow"; rs.style.opacity=".7";
    rs.innerHTML=`<span>${tr("restore")}</span>`;
    rs.addEventListener("click",()=>Billing.restore());
    grid.appendChild(rs);
  },
  shopHasNew(){                          // any buyable tier not yet seen?
    const avail=unlockedCount();
    return SHOP_CATS.some(c=>avail>S.shopSeen[c]);
  },
  /* equipped colour scheme drives the trail AND the UI accent palette */
  applyScheme(){
    document.documentElement.style.setProperty("--accent",this.trailColor());
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   ADS — AdMob via @capacitor-community/admob + Google UMP consent.

   Wired but inert outside the native app: every entry point feature-
   detects the plugin and no-ops with a console log, so browser dev
   never crashes and never even touches ad code paths.

   Placement policy:
   · Banner       → anchored bottom, shown once at app start; its height
                    is fed into --banner-h so no UI sits behind it.
   · Interstitial → on game-over, only every Nth death
                    (CONFIG.ADS_INTERSTITIAL_EVERY_N_DEATHS) AND at most
                    once per ADS_INTERSTITIAL_MIN_INTERVAL_S seconds —
                    and NEVER while a rewarded "continue" is still on the
                    table: an eligible interstitial goes PENDING and only
                    fires once revive is unavailable or declined (Retry/
                    Home). Watching any rewarded ad cancels it for that
                    death: the rewarded impression always wins.
   · Rewarded     → user-initiated only: "2× XP" and "CONTINUE" buttons
                    on the game-over screen.
   · UMP consent  → requested BEFORE initialize/ads, per Google policy;
                    "Privacy & ad options" button re-shows the form.
   ═══════════════════════════════════════════════════════════════════════ */
const Ads={
  interstitialLoaded:false, rewardedLoaded:false,
  lastInterstitialAt:0, pendingReward:null, doubleXPUsed:false,
  interstitialPending:false,   // cadence-eligible, waiting on the revive decision

  plugin(){ return (CONFIG.ADS_ENABLED && window.Capacitor?.isNativePlatform?.() && window.Capacitor?.Plugins?.AdMob) || null; },

  async init(){
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] AdMob plugin not available — ads disabled (browser/dev mode)"); return; }
    try{
      /* ── 1. UMP consent flow (GDPR/UK/US-state). Must complete before
             ads are requested. Inert outside consent regions. ───────── */
      try{
        const info=await AdMob.requestConsentInfo({});
        if(info?.isConsentFormAvailable && info?.status==="REQUIRED"){
          await AdMob.showConsentForm();
        }
        S.consentDone=true; save();
      }catch(e){ console.warn("[ads] consent flow failed (continuing)",e); }

      /* ── 2. SDK init. ADS_TESTING_MODE requests test ads everywhere. ── */
      await AdMob.initialize({ initializeForTesting: CONFIG.ADS_TESTING_MODE });

      /* ── 3. Event listeners (loaded/dismissed/reward) ────────────── */
      AdMob.addListener("bannerAdSizeChanged",(size)=>{
        // reserve layout space so the banner never covers game UI
        const h=clamp(Math.round(size?.height||0),0,140);
        document.documentElement.style.setProperty("--banner-h",h+"px");
        Game.resize();
      });
      AdMob.addListener("interstitialAdLoaded",()=>{ this.interstitialLoaded=true; });
      AdMob.addListener("interstitialAdDismissed",()=>{ this.interstitialLoaded=false; this.prepInterstitial(); });
      AdMob.addListener("onRewardedVideoAdLoaded",()=>{ this.rewardedLoaded=true; });
      AdMob.addListener("onRewardedVideoAdReward",()=>{ this.grantPendingReward(); });
      AdMob.addListener("onRewardedVideoAdDismissed",()=>{ this.rewardedLoaded=false; this.pendingReward=null; this.prepRewarded(); });

      /* ── 4. Banner up immediately, full-screen formats pre-loaded.
             Remove-Ads IAP suppresses banner + interstitial ONLY —
             rewarded ads stay live (players opt in for the reward). ── */
      if(S.removeAds){
        console.log("[ads] Remove-Ads owned — banner/interstitial suppressed");
      }else{
        await AdMob.showBanner({
          adId: CONFIG.BANNER_AD_UNIT_ID,
          adSize: "ADAPTIVE_BANNER",
          position: "BOTTOM_CENTER",
          margin: 0,
          isTesting: CONFIG.ADS_TESTING_MODE,
        });
        // the boot purchase check (Billing.reconcile) runs in parallel and
        // may have restored Remove Ads while the banner was loading
        if(S.removeAds) this.applyRemoveAds();
        else this.prepInterstitial();
      }
      this.prepRewarded();   // ALWAYS — rewarded is exempt from Remove-Ads
      console.log("[ads] initialized");
    }catch(e){ console.warn("[ads] init failed — continuing without ads",e); }
  },

  async prepInterstitial(){
    const AdMob=this.plugin(); if(!AdMob) return;
    try{ await AdMob.prepareInterstitial({ adId: CONFIG.INTERSTITIAL_AD_UNIT_ID, isTesting: CONFIG.ADS_TESTING_MODE }); }
    catch(e){ console.warn("[ads] interstitial prepare failed",e); }
  },
  async prepRewarded(){
    const AdMob=this.plugin(); if(!AdMob) return;
    try{ await AdMob.prepareRewardVideoAd({ adId: CONFIG.REWARDED_AD_UNIT_ID, isTesting: CONFIG.ADS_TESTING_MODE }); }
    catch(e){ console.warn("[ads] rewarded prepare failed",e); }
  },

  rewardedReady(){ return this.rewardedLoaded; },

  /* game-over hook: decide interstitial ELIGIBILITY only — never show
     here. The revive decision resolves first (see reviveDeclined /
     showRewarded); the interstitial fires only after it. */
  onGameOver(){
    this.doubleXPUsed=false;
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] (no-op) interstitial check, death #"+S.deaths); return; }
    const everyN=CONFIG.ADS_INTERSTITIAL_EVERY_N_DEATHS;
    const cooled=(Date.now()-this.lastInterstitialAt)/1000>=CONFIG.ADS_INTERSTITIAL_MIN_INTERVAL_S;
    // Remove-Ads layers ON TOP of the cadence + revive gate (kills the
    // interstitial outright; the rest of the gate logic is unchanged)
    this.interstitialPending=!S.removeAds && this.interstitialLoaded && cooled && S.deaths%everyN===0;
    // Revive not on offer this death (ad continue spent AND coins short)?
    // Then there's nothing to contend with — resolve immediately.
    const reviveOffered=(!Game.revived && this.rewardedLoaded) || S.coins>=Game.nextRevivePrice();
    if(!reviveOffered) this.flushInterstitial();
  },
  /* player passed on revive: Retry / Home tapped on the over screen */
  reviveDeclined(){ this.flushInterstitial(); },
  async flushInterstitial(){
    if(S.removeAds){ this.interstitialPending=false; return; }  // IAP guard
    if(!this.interstitialPending) return;
    this.interstitialPending=false;
    const AdMob=this.plugin(); if(!AdMob) return;
    try{
      Audio2.suspend();               // never play game audio under an ad
      await AdMob.showInterstitial();
      this.lastInterstitialAt=Date.now();
    }catch(e){ console.warn("[ads] interstitial show failed",e); this.prepInterstitial(); }
  },

  async showRewarded(kind){
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] (no-op) rewarded requested:",kind); return; }
    if(!this.rewardedLoaded) return;
    this.interstitialPending=false;   // rewarded impression wins this death
    this.pendingReward=kind;
    try{ Audio2.suspend(); await AdMob.showRewardVideoAd(); }
    catch(e){ console.warn("[ads] rewarded show failed",e); this.pendingReward=null; this.prepRewarded(); }
  },
  rewardDoubleXP(){
    if(this.doubleXPUsed) return;
    this.showRewarded("doublexp");
  },
  rewardContinue(){
    if(Game.revived) return;
    this.showRewarded("continue");
  },
  /* fires only on the SDK's reward event → user finished the ad */
  grantPendingReward(){
    const kind=this.pendingReward; this.pendingReward=null;
    if(kind==="doublexp"){
      this.doubleXPUsed=true;
      const extra=Math.round(Game.runXPGained*(CONFIG.REWARDED_DOUBLE_XP_MULT-1));
      Progress.gainXP(extra,true);      // raw: multipliers already applied
      Game.runXPGained+=extra;
      $("o-xp").textContent=`+${Game.runXPGained} XP (${CONFIG.REWARDED_DOUBLE_XP_MULT}×!)`;
      $("btn-doublexp").disabled=true;
      UI.toast(tr("bonus_xp",{n:extra}),true);
      UI.gameOverXPRefresh?.();
    }else if(kind==="continue"){
      UI.toast(tr("run_continues"),true);
      Game.revive(true);   // true = consumes the once-per-run AD continue
    }
  },

  /* Remove-Ads purchased (or restored) mid-session: take the banner
     down and give its reserved space back. Rewarded ads UNTOUCHED —
     the continue/2×XP buttons must keep working after the purchase. */
  async applyRemoveAds(){
    this.interstitialPending=false;
    const AdMob=this.plugin(); if(!AdMob) return;
    try{
      await AdMob.removeBanner();
      document.documentElement.style.setProperty("--banner-h","0px");
      Game.resize();
    }catch(e){ console.warn("[ads] banner removal failed",e); }
  },

  /* "Privacy & ad options" — re-show the UMP form so users can change
     consent any time (required by Google in consent regions). */
  async showPrivacyOptions(){
    const AdMob=this.plugin();
    if(!AdMob){ UI.toast(tr("privacy_web")); return; }
    try{
      if(typeof AdMob.showPrivacyOptionsForm==="function") await AdMob.showPrivacyOptionsForm();
      else await AdMob.showConsentForm();
    }catch(e){ console.warn("[ads] privacy form unavailable",e); }
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   BILLING — Google Play Billing via @capgo/native-purchases (pinned
   7.19.3, Capacitor-7 line). Same feature-detection pattern as Ads:
   in a browser every entry point no-ops with a console log.

   Products (all placeholder IDs in CONFIG):
   · Coin packs   → consumables, repeat-purchasable, grant into S.coins
                    (the same save the shop already spends from).
   · Remove Ads   → non-consumable, persisted as S.removeAds; kills
                    banner + interstitial ONLY. Rewarded ads are exempt
                    by design — players opt into those for rewards.
   · Restore      → Play requires non-consumables to be restorable;
                    re-grants Remove-Ads found in purchase history.
   Test with Play's License Testing accounts (Play Console → Settings →
   License testing) — testers see test-card purchase flows, no charge.
   ═══════════════════════════════════════════════════════════════════════ */
const Billing={
  plugin(){ return (CONFIG.IAP_ENABLED && window.Capacitor?.isNativePlatform?.() && window.Capacitor?.Plugins?.NativePurchases) || null; },

  async init(){
    const NP=this.plugin();
    if(!NP){ console.log("[iap] billing plugin not available — purchases disabled (browser/dev mode)"); return; }
    try{ // warm the product cache so the store sheet opens instantly
      await NP.getProducts({
        productIdentifiers:[...CONFIG.IAP_COIN_PACKS.map(p=>p.productId),CONFIG.IAP_REMOVE_ADS_PRODUCT_ID],
        productType:"inapp",
      });
      console.log("[iap] initialized");
    }catch(e){ console.warn("[iap] product query failed (continuing)",e); }
    // reinstall / new device: get the ad-free state back with no tap.
    // Silent: no toast, no error shown, whatever happens.
    try{ await this.reconcile(true); }
    catch(e){ console.warn("[iap] boot purchase check failed (silent)",e); }
  },

  /* Read what Play says this account owns. restorePurchases() resolves to
     nothing in 7.19.3, so ownership always comes from getPurchases().
     Returns {removeAds} = whether a completed Remove Ads purchase exists. */
  async reconcile(silent){
    const NP=this.plugin(); if(!NP) return {removeAds:false};
    const res=await NP.getPurchases({ productType:"inapp" });
    const list=Array.isArray(res?.purchases)?res.purchases:[];
    const removeAds=list.some(t=>t?.productIdentifier===CONFIG.IAP_REMOVE_ADS_PRODUCT_ID && this.completed(t));
    if(removeAds) this.grantRemoveAds(silent);
    // Coin packs still on the account were paid but never consumed: the
    // app died mid-flow, a pending (cash) payment cleared later, or the
    // plugin's consume failed. Pay each token once, then consume it so
    // the pack can be bought again. Pending ones wait for a later boot.
    let granted=0;
    for(const t of list){
      if(!this.packFor(t) || !this.completed(t)) continue;
      if(this.grantPack(t,silent)) granted++;
      if(t.purchaseToken){
        try{ await NP.consumePurchase({ purchaseToken:t.purchaseToken }); }
        catch(e){ console.warn("[iap] consume failed (retried next launch)",e); }
      }
    }
    return {removeAds, granted};
  },

  /* Grant only completed purchases: Android purchaseState "1" = PURCHASED
     (7.19.3 Transaction docs). Pending ones never resolve purchaseProduct
     (it rejects "Purchase is pending") and are picked up by reconcile(). */
  completed(t){ return t?.purchaseState==="1"; },
  isPendingError(e){ return /pending/i.test(String(e?.message||e?.errorMessage||e||"")); },
  tokenOf(t){ return t?.purchaseToken||t?.orderId||t?.transactionId||""; },
  packFor(t){ return CONFIG.IAP_COIN_PACKS.find(p=>p.productId===t?.productIdentifier)||null; },
  /* pay a completed coin-pack purchase exactly once per token */
  grantPack(t,silent){
    const pack=this.packFor(t), key=this.tokenOf(t);
    if(!pack || !this.completed(t)) return false;
    if(!key){ console.warn("[iap] purchase has no token; not granted",t); return false; }
    if(S.iapGranted.includes(key)) return false;
    S.iapGranted.push(key);
    if(S.iapGranted.length>CONFIG.IAP_GRANTED_MAX) S.iapGranted.splice(0,S.iapGranted.length-CONFIG.IAP_GRANTED_MAX);
    this.grantCoins(pack.coins,silent);
    return true;
  },

  async buyCoinPack(idx){
    const pack=CONFIG.IAP_COIN_PACKS[idx];
    const NP=this.plugin();
    if(!NP){
      console.log("[iap] (no-op) coin pack purchase:",pack.productId);
      UI.toast(tr("iap_web"));
      return;
    }
    try{
      // resolves only on a completed purchase; throws on cancel/failure.
      // isConsumable:true → the plugin consumes the token so the pack can
      // be bought again (the 7.19.3 default is false = owned forever).
      const t=await NP.purchaseProduct({ productIdentifier:pack.productId, productType:"inapp", quantity:1, isConsumable:true });
      if(!this.completed(t)){ UI.toast(tr("iap_pending")); return; }
      if(!this.grantPack(t,false)) console.warn("[iap] purchase already granted, not paid again",t);
    }catch(e){
      if(this.isPendingError(e)) UI.toast(tr("iap_pending"));
      else console.warn("[iap] purchase failed/cancelled",e);
    }
  },
  grantCoins(n,silent=false){
    S.coins+=n; save();               // same persistence the shop spends
    if(!silent){
      Audio2.unlock(); Haptics.perfect();
      UI.toast(tr("coins_added",{n}),true);
    }
    UI.refreshHome();
    if(!$("unlocks").classList.contains("hidden")) UI.renderUnlocks();
  },

  async buyRemoveAds(){
    const NP=this.plugin();
    if(!NP){
      console.log("[iap] (no-op) remove-ads purchase:",CONFIG.IAP_REMOVE_ADS_PRODUCT_ID);
      UI.toast(tr("iap_web"));
      return;
    }
    if(S.removeAds) return;
    try{
      // non-consumable: never consumed, so it stays owned and restorable
      const t=await NP.purchaseProduct({ productIdentifier:CONFIG.IAP_REMOVE_ADS_PRODUCT_ID, productType:"inapp", quantity:1, isConsumable:false });
      if(!this.completed(t)){ UI.toast(tr("iap_pending")); return; }
      this.grantRemoveAds();
    }catch(e){
      if(this.isPendingError(e)) UI.toast(tr("iap_pending"));
      else console.warn("[iap] purchase failed/cancelled",e);
    }
  },
  grantRemoveAds(silent=false){
    if(S.removeAds) return;
    S.removeAds=true; save();
    Ads.applyRemoveAds();             // banner down, interstitials off…
    // …rewarded continue/2×XP DELIBERATELY untouched (see Ads header)
    if(!silent){
      Audio2.unlock(); Haptics.perfect();
      UI.toast(tr("ads_removed_toast"),true);
    }
    if(!$("unlocks").classList.contains("hidden")) UI.renderUnlocks();
  },

  /* Play policy: non-consumables must be restorable (reinstall/new
     device). Consumable coin packs are intentionally NOT restorable. */
  async restore(){
    const NP=this.plugin();
    if(!NP){ console.log("[iap] (no-op) restore purchases"); UI.toast(tr("restore_web")); return; }
    try{
      // resolves to nothing; it only makes Play finish/acknowledge
      // anything outstanding. Ownership is read by reconcile().
      try{ await NP.restorePurchases(); }
      catch(e){ console.warn("[iap] restorePurchases failed (continuing)",e); }
      const had=S.removeAds;
      const {removeAds,granted}=await this.reconcile(false);
      if(!removeAds && !granted) UI.toast(tr("no_restore"));
      else if(had) UI.toast(tr("ads_removed_toast"),true); // already applied: still confirm
    }catch(e){ console.warn("[iap] restore failed",e); }
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   CREW — optional email invite, browser version only.
   Fair by design: never during play, never required, never blocks
   "play again", gone for good after a signup or after two closes.
   Signups go to the ETS site's Netlify form "newsletter"; the shown /
   joined / closed totals go to the site's counter (/stats/). Nothing else
   about the player is sent.
   ═══════════════════════════════════════════════════════════════════════ */
const Crew={
  open:false, shownThisVisit:false, timer:0, country:"",
  ref:(()=>{ try{ return (new URLSearchParams(location.search).get("ref")||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,24); }catch(e){ return ""; } })(),
  /* web only: the Android app (Capacitor) never shows it */
  available(){
    return CONFIG.CREW_ENABLED && !window.Capacitor?.isNativePlatform?.() && /^https?:$/.test(location.protocol);
  },
  init(){
    if(!this.available()) return;
    S.crew.sess++; save();                        // one visit = one page load
    $("crew-form").addEventListener("submit",e=>{ e.preventDefault(); this.submit(); });
    $("crew-skip").addEventListener("click",()=>{ Audio2.ui(); this.close(true); });
    $("crew-x").addEventListener("click",()=>{ Audio2.ui(); this.close(true); });
    this.text();
  },
  text(){
    $("crew-h").textContent=tr("crew_title");
    $("crew-p").textContent=tr("crew_text");
    $("crew-email").placeholder=tr("crew_ph");
    $("crew-email").setAttribute("aria-label",tr("crew_ph"));
    $("crew-go").textContent=tr("crew_go");
    $("crew-skip").textContent=tr("crew_skip");
    $("crew-fine").textContent=tr("crew_fine");
    $("crew-pv").textContent=tr("privacy_link");
    $("crew-x").setAttribute("aria-label",tr("crew_skip"));
  },
  eligible(){
    const c=S.crew;
    return this.available() && !c.done && c.closes<CONFIG.CREW_MAX_CLOSES && !this.shownThisVisit
      && S.runsPlayed>=CONFIG.CREW_MIN_RUNS && c.sess-c.last>=CONFIG.CREW_EVERY_N_SESSIONS;
  },
  maybeOffer(newBest,legendary){
    if(!(newBest||legendary) || !this.eligible()) return;
    clearTimeout(this.timer);
    const shownAt=UI.overShownAt;
    this.timer=setTimeout(()=>{
      // the player may already have tapped "play again" — then skip it, no harm done
      if(Game.state!=="over"||UI.overShownAt!==shownAt) return;
      this.show();
    },CONFIG.CREW_DELAY_MS);
  },
  show(){
    this.open=true; this.shownThisVisit=true;
    S.crew.last=S.crew.sess; save();
    const el=$("crew"); el.classList.remove("done","hidden");
    $("crew-form").classList.remove("hidden"); $("crew-skip").classList.remove("hidden");
    $("crew-msg").textContent=""; $("crew-email").value=""; $("crew-go").disabled=false;
    this.text();
    this.hit("ask");
    this.lookupCountry();
  },
  /* closed with ✕ / "No thanks" (counted), or quietly by a new run / Home
     (also counted once: either way the player chose not to join) */
  close(byButton){
    clearTimeout(this.timer);
    if(!this.open) return;
    this.open=false;
    $("crew").classList.add("hidden");
    if(S.crew.done) return;
    S.crew.closes++; save();
    this.hit("skip");
  },
  submit(){
    const email=$("crew-email").value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)||email.length>200){
      $("crew-msg").textContent=tr("crew_bad"); $("crew-email").focus(); return;
    }
    if($("crew-hp").value) { this.thanks(); return; }        // bots fill the hidden field
    $("crew-go").disabled=true; $("crew-msg").textContent="";
    const body=new URLSearchParams({"form-name":"newsletter","bot-field":"",email,
      source:"game",game:"orbit-rush",lang:Lang.cur,country:this.country,ref:this.ref||"direct"});
    // Netlify Forms accepts a plain form POST from the game's own domain;
    // "no-cors" means we can't read the reply, so only a network failure counts as an error
    fetch(CONFIG.CREW_SITE+"/",{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
      .then(()=>{ S.crew.done=true; save(); this.hit("join"); this.thanks(); })
      .catch(()=>{ $("crew-go").disabled=false; $("crew-msg").textContent=tr("crew_err"); });
  },
  thanks(){
    S.crew.done=true; save();
    $("crew").classList.add("done");
    $("crew-form").classList.add("hidden"); $("crew-skip").classList.add("hidden");
    $("crew-h").textContent=tr("crew_done");
    $("crew-p").textContent=tr("crew_done_text");
    $("crew-email").blur();
    Audio2.unlock(); Haptics.perfect?.();
    setTimeout(()=>{ if(this.open){ this.open=false; $("crew").classList.add("hidden"); } },2600);
  },
  lookupCountry(){
    if(this.country) return;
    try{
      fetch(CONFIG.CREW_SITE+"/api/geo",{cache:"no-store"}).then(r=>r.ok?r.json():{}).then(j=>{
        if(j&&/^[A-Z]{2}$/.test(j.country||"")) this.country=j.country; }).catch(()=>{});
    }catch(e){}
  },
  /* totals only (no ID, no email): ask / join / skip, by language, country, source */
  hit(e){
    const data=JSON.stringify({e,ref:this.ref||"direct",lang:Lang.cur,game:"orbit-rush"});
    try{ if(navigator.sendBeacon&&navigator.sendBeacon(CONFIG.CREW_SITE+"/api/hit",data)) return; }catch(err){}
    try{ fetch(CONFIG.CREW_SITE+"/api/hit",{method:"POST",mode:"no-cors",body:data,keepalive:true}).catch(()=>{}); }catch(err){}
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   LIFECYCLE — pause loop & kill audio when backgrounded (browser
   visibility API + Capacitor App plugin when native).
   ═══════════════════════════════════════════════════════════════════════ */
function wireLifecycle(){
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ Audio2.suspend(); UI.pause(); }
  });
  const App=window.Capacitor?.Plugins?.App;
  if(App){
    App.addListener("appStateChange",({isActive})=>{
      if(!isActive){ Audio2.suspend(); UI.pause(); }
    });
    // Android hardware back: pause instead of killing the activity mid-run.
    // "dying" (the short slow-mo before game over) ignores back, and back
    // in the shop returns home: neither may exit the app.
    App.addListener("backButton",()=>{
      if(Game.state==="playing") UI.pause();
      else if(Game.state==="dying") return;
      else if(Game.state==="paused"||Game.state==="over"||!$("unlocks").classList.contains("hidden")) UI.home();
      else App.exitApp();
    });
  }
}
